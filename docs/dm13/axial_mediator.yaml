# DM8 gate model G2 (docs/dm8/gate_models.yaml), as a typed model for Track 1.
name: axial_mediator
stability: 'Z2: the dark matter is odd, every other field even'
fields:
- name: chi
  role: dark_matter
  dark_parity: -1
  spin: 0.5
  mass_gev: 100.0
- name: Zp
  role: mediator
  dark_parity: 1
  spin: 1.0
  self_conjugate: true
  mass_gev: 2000.0
- name: q
  role: standard_model
  spin: 0.5
couplings:
- name: g_chi
  value: 1.0
- name: g_q
  value: 0.25
terms:
- fields:
  - field: chi
    conjugate: true
  - field: chi
  - field: Zp
  lorentz: axial
  coupling: g_chi
- fields:
  - field: q
    conjugate: true
  - field: q
  - field: Zp
  lorentz: axial
  coupling: g_q
