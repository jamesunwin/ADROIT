# The halo count ratio's validation points (halo_limits; the owner's condition 4, 2026-10-19), declared before any
# full calculation at a halo of the region ran. For each slow module and kind it is validated for: three masses inside
# the module's validated range (near its low edge, where the velocity distribution's tail matters most, in the middle,
# and near its high edge), and seven halos of the preset's region: its centre, the four extremes of v0 and v_esc on the
# boundary of the joint 95% disc, and the two diagonals where both are lowest and both are highest. The density is
# exact (limits are proportional to 1/rho0 at fixed velocities), so only velocities are checked.
#
# Gate, declared with the points: for each module and kind, the count ratio's limit, L_ref x (rho_ref/rho0) x
# N_ref/N_h with L_ref the module's own 95% limit computed directly at its reference halo, is compared with the
# module's full procedure at the same halo; the largest |L_ratio/L_full - 1| over its 21 points (template noise
# included) is its empirical error e. The ratio is used for that module and kind, between its lowest and highest
# validated masses, only if e <= 0.15; otherwise it gets full calculations or stays pending. e is an estimate, not a
# bound: a comparison the ratio decides must clear the limit by 2e.
gate_max_discrepancy: 0.15
halos:                                # (v0, v_esc) in standardised units of the preset: (a, b) -> v0 + a s_v0, v_esc + b s_esc
  centre: [0.0, 0.0]
  v0_low: [-1.0, 0.0]
  v0_high: [1.0, 0.0]
  v_esc_low: [0.0, -1.0]
  v_esc_high: [0.0, 1.0]
  both_low: [-0.7071067811865476, -0.7071067811865476]
  both_high: [0.7071067811865476, 0.7071067811865476]
# the halo coordinates above are directions; the boundary ones are scaled to the region's radius (2.796), the centre is 0
modules:
  LZ WS2022+WS2024:
    SI: [10.0, 30.0, 90.0]
  XENONnT SR0+SR1:
    SI: [30.0, 150.0, 1000.0]
    SD-proton: [25.0, 200.0, 5000.0]
    SD-neutron: [25.0, 200.0, 5000.0]
  PandaX-4T Run0+Run1:
    SI: [150.0, 1000.0, 9000.0]
    SD-proton: [150.0, 500.0, 1800.0]
    SD-neutron: [350.0, 2000.0, 10000.0]
  CDMSlite Run 2:
    SI: [1.5, 5.0, 20.0]
    SD-proton: [1.5, 5.0, 20.0]
    SD-neutron: [1.5, 5.0, 20.0]
