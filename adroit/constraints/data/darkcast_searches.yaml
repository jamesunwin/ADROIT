  NA64_Banerjee2019hmi:
    name: NA64 2019 visible
    reference: arXiv:1912.11389
    signal: beam dump
    cl: 0.9
    cl_quote: 'FIG. 5: The 90% C.L. exclusion areas in the (mX; ϵ) plane from the NA64 experiment (blue area).'
    cl_page: 6
    cl_source: arXiv:1912.11389 (NA64)
