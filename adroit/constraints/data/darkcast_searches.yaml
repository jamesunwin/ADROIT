    cl_page: 4
    cl_source: arXiv:1209.6083 (Andreas et al. reanalysis); original paper not read
    notes: Fig. 2 green dash-dotted curve. Zero observed events.
  Orsay_Davier1989wz:
    name: Orsay 1989
    reference: none (PLB 229 (1989) 150); curve from arXiv:1209.6083
    signal: beam dump
    cl: 0.95
    cl_quote: This translates to a 95% C.L. upper limit N95%up of 3 events on hidden photons.
    cl_page: 4
    cl_source: arXiv:1209.6083 (Andreas et al. reanalysis); original paper not read
    notes: Fig. 2 blue solid curve. Zero observed events.
  NuCAL_Blumlein1991xh:
    name: NuCAL 1991
    reference: none (IJMPA 7 (1992) 3835); curve from arXiv:1311.3870
    signal: beam dump
    cl: 0.95
    cl_quote: This relation is used to calculate the corresponding event numbers for both muon and electron signatures at
      the 95% C.L. for the mass range where both channels contribute.
    cl_page: 11
    cl_source: arXiv:1311.3870 (Blümlein & Brunner, PLB 731 (2014) 320); original paper not read
    notes: 'DarkCast took the red "ν-Cal I (p-Bremsstrahlung)" curve of 1311.3870 Fig. 5. That curve is this reanalysis, which
      uses CLs and 95% C.L. (p11): "For N = 1 observed events and a background of b = 0.3 (e+e−channel) a signal of 4.5 events
      can be excluded at 95% C.L. (c = 0.95)." Above 2mμ it combines the e and μ channels, but DarkCast sets decay = e_e only.
      The production is proton bremsstrahlung.'
  NuCAL_Tsai2019mtm:
    name: NuCAL 2019
    reference: arXiv:1908.07525
    signal: beam dump
    cl: 0.9
    cl_quote: For a 90 percent confidence level exclusion we require nevent=3.64 events from dark photon decays (see [117]).
    cl_page: 6
    cl_source: arXiv:1908.07525 (Tsai, deNiverville, Liu)
    notes: Fig. 3a caption (p12). This curve is 90% CL, whereas the other NuCal curve (NuCAL_Blumlein1991xh) is 95% CL. The
      data are 1 observed event over an expected background of 0.3, with E > 10 GeV. The production is π0 and η meson decays.
      The authors call their CHARM and NuCal limits "conservative".
  CHARM_Tsai2019mtm:
    name: CHARM 2019
    reference: arXiv:1908.07525
    signal: beam dump
    cl: null
    cl_quote: No events were found satisfying the selection criteria listed in the experimental data.
    cl_page: 6
    cl_source: arXiv:1908.07525 (Tsai, deNiverville, Liu)
    notes: The CHARM section (p5–6) gives neither a CL nor an excluded event number. 90% is likely, with 2.3 events for zero
      observed and zero background, because the same paper uses 90% for NuCal (p6) and NA62 (p7). It is not stated for CHARM.
      Gninenko's earlier CHARM reanalysis (arXiv:1204.3583) was not read.
  PS191_Bernardi1985ny:
    name: PS191 1985
    reference: none (PLB 166B (1986) 479); curve from arXiv:1112.5438 via arXiv:1311.3870
    signal: beam dump
    cl: 0.9
    cl_quote: Using Eqs.(5,6) we can determine the 90% C.L. exclusion regions in the (MV; χ) plane from the results of the
      NOMAD [22] and PS191 [20] experiments, which are shown in Fig. 4 together with the area excluded by the electron beam
      dump experiment E137 at SLAC [28], see Ref.[29]
    cl_page: 3
    cl_source: arXiv:1112.5438 (Gninenko, PRD 85 (2012) 055027); original PS191 paper not read
    notes: DarkCast digitised the tip of the gray "NOMAD & PS191" curve in 1311.3870 Fig. 5. Ref. [29] there is Gninenko 1112.5438.
