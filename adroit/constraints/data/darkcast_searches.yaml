    notes: The CL belongs to the Andreas et al. reanalysis, Fig. 2 (magenta dotted). It is not the original experiment's CL.
      Andreas et al. note that their Nobs and 95% values differ slightly from Bjorken et al. 2009 (Table I caption, p4).
  E774_Bross1989mp:
