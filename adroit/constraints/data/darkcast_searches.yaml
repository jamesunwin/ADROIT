  BaBar_Lees2017lec:
    name: BaBar 2017
    reference: arXiv:1702.03327
    signal: missing mass
    cl: 0.9
    cl_quote: 'FIG. 4: Upper limits at 90% CL on A′ mixing strength squared ε2 as a function of mA′.'
    cl_page: 6
    cl_source: arXiv:1702.03327 (BaBar, PRL 119 (2017) 131804)
    resolution_m2_gev2: 0.7
    resolution_quote: The resolution for signal events decreases monotonically from σ(M 2 X) = 1.5 GeV2 for mA′ ≈0 to σ(M
      2 X) = 0.7 GeV2 for mA′ = 8 GeV.
    resolution_page: 5
    notes: DarkCast's Fig. 5 (p7) has no CL in its caption. p6 says "At each value of mA′ we compute a limit on ε as a square
