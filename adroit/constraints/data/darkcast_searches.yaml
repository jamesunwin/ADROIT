    signal: beam dump
    cl: 0.95
    cl_quote: For the SLAC E141 experiment [47], we extract from Fig. 1c for x ≥0.7 a total of 1126±1312 events, which corresponds
      to a 95% C.L. upper limit of N95%up = 3419 events.
