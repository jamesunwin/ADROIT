    signal: beam dump
    cl: 0.95
    cl_quote: The acceptance corrected 95% C.L. upper limit of N95%up = 18 events leads to the exclusion contour in Fig. 2.
    cl_page: 4
    cl_source: arXiv:1209.6083 (Andreas et al. reanalysis); original paper not read
    notes: Fig. 2 orange long-dashed curve. Bjorken et al. 2009 instead used an 'expected signal of 17 events' (0906.0580
      p6).
  KEK_Konaka1986cb:
    name: KEK 1986
    reference: none (PRL 57 (1986) 659); curve from arXiv:1209.6083
    signal: beam dump
    cl: 0.95
    cl_quote: The corresponding 95% C.L. upper limit N95%up of 3 events together with the acceptance leads for hidden photons
