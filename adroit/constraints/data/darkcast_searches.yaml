      A profile-likelihood limit is shown only in Fig. 4. The limit runs to mA′ ≤ 8 GeV. Converting to mass gives σ_m ≈ σ(M²)/(2m)
      (derived), about 44 MeV at 8 GeV. That linearisation fails below about 1.2 GeV, where σ(M²) ≳ m².
  NA64_NA642019imj:
    name: NA64 2019 invisible
    reference: arXiv:1906.00176
    signal: missing energy
    cl: 0.9
    cl_quote: 'FIG. 3: The NA64 90% C.L. exclusion region in the (mA′, ϵ) plane.'
    cl_page: 4
    cl_source: arXiv:1906.00176 (NA64, PRL 123 (2019) 121801)
