  NA62_CortinaGil2019nuo:
    name: NA62 2019
    reference: arXiv:1903.08767
    signal: missing mass
    cl: 0.9
    cl_quote: 'Figure 7: Upper limit at 90% CL from NA62 (red region) in the ϵ2 vs MA′ plane with A′ decaying into invisible
      final states.'
    cl_page: 15
    cl_source: arXiv:1903.08767 (NA62)
    resolution_m2_gev2: 0.00057
    resolution_quote: '...for each A′ mass value the signal region optimizing the upper limit in a background-only hypothesis
