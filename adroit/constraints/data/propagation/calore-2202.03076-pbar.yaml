record: calore-2202.03076-pbar
source: 'Calore et al., arXiv:2202.03076 (SciPost Phys. 12, 163), Fig. 4 (p. 14): b b̄, 95% CL; left panel the dark-matter
  profiles of Table 1 with the BIG scheme, right panel the BIG, SLIM and QUAINT schemes with the benchmark NFW'
digitised: '2026-10-11'
by: docs/dm7/digitise_calore_propagation.py, from the vector paths
calibration:
  decade spacing: from the major ticks
  anchor: the BIG/NFW curve on Fig. 2's b b̄ curve
  max residual dex:
    profiles: 0.005808459089166718
    schemes: 0.005811353728493174
checks:
  cored weakens the bound at every mass: true
  contracted NFW strengthens it at every mass: true
  profile shifts below a factor two: true
  QUAINT tighter than BIG below 100 GeV: true
  QUAINT weaker than BIG above 1 TeV: true
models:
  central: 'the paper''s fiducial bound: BIG transport, benchmark NFW (ρ⊙ = 0.385 GeV/cm³), halo height and solar modulation
    profiled'
  conservative: the weakest bound over the paper's transport schemes (BIG, SLIM, QUAINT) times the weakest over its profiles
    (benchmark NFW, cored, contracted NFW), mass by mass
  aggressive: the strongest bound over the same schemes and profiles, mass by mass
assumptions:
- 'the scheme and profile shifts are read for b b̄ and applied to every channel (the paper: the profile shifts are ''rather
  similar'' for the other channels; the scheme shifts change shape and are shown for b b̄ only)'
- the two shifts multiply (each panel varies one choice with the other at its fiducial value)
- outside the figure's masses the conservative factor is its largest value and the aggressive its smallest
- ρ⊙ stays at the paper's 0.385 GeV/cm³; the bounds scale as ρ⊙⁻² (a 30% uncertainty in ρ⊙ is about 70% in the signal, the
  paper notes)
