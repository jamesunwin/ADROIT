source: 'LHCb, arXiv:1612.07818 (PRD 95 (2017) 071101), Fig. 4, PDF page 7: the 95% CL upper limit on BR(B+ -> K+ chi) x BR(chi
  -> mu mu) against m(chi) and tau(chi), from the PDF''s 45131 coloured cells, each colour matched exactly to one of the colour
  bar''s 255 bands (a logarithmic scale: 10^-10 at its foot, 10^-7 at y = 88.91 pt, 45.311 pt a decade, each band 0.5644 pt,
  0.01246 decades, its centre taken: every cell''s stored value is its band''s centre to 10^-4 decades, rechecked 2026-11-06);
  m(chi) = 1000 + (x - 201.547)/0.0586103 MeV (ticks 1000-4000), log10(tau/ps) = -1 + (224.843 - y)/35.1005 (ticks 0.1-1000
  ps). Each row is LHCb''s limit at one lifetime, log10(tau/ps) = -1, -0.9, ..., 3 (41, the paper''s 0.1 < tau < 1000 ps):
  the figure draws each from its lifetime up one cell (0.1 decade), so its top row reaches 10^3.1 ps, past the paper''s range
  (the owner''s review, 2026-11-06: a cell edge, not a lifetime). Its mass segments [m_low, m_high, log10 limit] are the cells
  of that row; vetoed masses (K_S, J/psi, psi(2S), psi(3770), part of phi and psi(4160)) have no segment.'
