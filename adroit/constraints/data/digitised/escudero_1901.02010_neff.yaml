source: 'Escudero, Hooper, Krnjaic & Pierre, arXiv:1901.02010 (JHEP 03 (2019) 071), Fig. 2, PDF page 6: the L_mu - L_tau Z''
  contours of constant Delta N_eff (0.5 solid, 0.2 dashed, 0.1 dash-dotted), from the PDF''s stroked paths, each clipped to
  the frame it is drawn in; top frame no kinetic mixing, bottom frame the natural kinetic mixing epsilon = g/70. Coordinates
  log10(m_Z''/MeV) (ticks -6...2 at x = 126.168 + 46.505 k pt) and log10 g_mu-tau (ticks -3...-13 at y = 101.638 (top), 325.895
  (bottom) + 17.1287 k pt). The frames'' lines: log10(m/MeV) -6.155 to 2.602, log10 g -13.097 to -2.398 (both frames); the
  paths run on under the frame''s clip (to log10 m = -14.24 and log10 g = -0.35), and only what the frame shows is kept, each
  crossing of its edge interpolated (the owner''s review, 2026-11-06). Each contour bounds the region above and to the left
  of it (Delta N_eff above its value).'
