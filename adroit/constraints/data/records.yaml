  - id: darkcast-dark-photon
    verified_on: 2026-10-13
    verified_by: JU
    verification_sha256: 4302b15b23c0d155b8dd32eee863ce89d8dca48d33ffe7d7729ccdb92087f399
    name: "Dark-photon searches compiled by DarkCast: visible (prompt, displaced, beam dumps) and invisible decays"
    constraint_class: beam_dump
    figure: {arxiv: "2005.01515", page: 36, label: "Fig. 3.3, the visible searches (Fig. 3.5, p. 39: invisible); a
             visual comparison only: the review took some limits from DarkCast and digitised others (p. 49)"}
    source: "DarkCast v2.1 (Ilten, Soreq, Williams & Xue, arXiv:1801.04847), commit 5a2a53a; each search's own paper,
             confidence level and mass resolution, with quotes and pages: data_file. BaBar arXiv:1406.2980 and
             1702.03327, LHCb arXiv:1910.06926, CMS arXiv:1912.04776, KLOE, A1, APEX, NA48/2, BESIII, HPS, E137, E141,
             E774, KEK, Orsay, NuCal, CHARM, PS191, NOMAD, NA64 (arXiv:1906.00176), NA62, LEP"
    data_file: adroit/constraints/data/darkcast_searches.yaml
    quantity: "ε limits against m_A′, each at its own paper's CL (90% or 95%; CHARM states none and is taken as 90%)"
    assumptions:
      - "the minimal dark photon (coupling εeQ); visible limits on ε √BR(visible), invisible on ε √BR(χχ̄)"
      - displaced and beam-dump limits only where A′ → χχ̄ is closed (they assume the visible lifetime)
      - "each file read in the format DarkCast defines, checked on load: LHCb's displaced search is a map of r =
         observed limit / predicted yield on an (m, ε) grid, excluded where r < 1 (interpolated in log m, log ε,
         log r); every other file is a lower, or lower and upper, ε limit (corrected 2026-10-13)"
      - "each search at its own CL: a 95% exclusion stands at 95%; a 90% one (or CHARM's) is a native exclusion,
         undecided at 95%; a point allowed by every search that covers its mass is allowed at 95% (corrected
         2026-10-13)"
      - "each search only within its narrow-peak assumption (replacing one Γ/m ≤ 10% for all, 2026-10-13): a bump
         hunt for Γ below its paper's mass resolution (the smallest it quotes, or NA48/2's σ = 0.067 MeV + 0.0105
         m); a missing-mass search for Γ below σ(M²)/(2m), at most 10% of m; a missing-energy search (NA64
         invisible, LEP) for Γ/m ≤ 10%. Outside it, the search is not used to exclude or to allow: a point it covers
         is undecided unless a search that applies excludes it (the owner's review, 2026-10-13)"
      - "LHCb prompt, CMS and HPS state no resolution for their own search; each takes the smaller of what the same
         collaboration states for the same data, or derives from it (data_file, with quotes; 2026-10-13): LHCb σ =
         0.12% × m (arXiv:2007.03923 p. 6, same 2016–2018 data, 0.6 MeV at threshold, halved by this search's vertex
         constraint); CMS σ = 0.7% × m (≈1.3% measured on the same scouting stream, arXiv:2403.16134 p. 33; 0.88%
         from this search's barrel window; 1%/√2 from the single-muon resolution); HPS σ = 0.85 MeV (its Møller
         calibration, 1.55 MeV at 34 MeV, scaled to 19 MeV)"
      - "HPS 2018 (arXiv:1807.11530) is a prompt bump hunt, not a displaced search; LEP is DarkCast's recast of the
         DELPHI mono-photon search (arXiv:1103.0240), not electroweak precision"
      - DarkCast is GPL-2.0-or-later, fetched into the tools folder and never copied into this repository
    checks: ["records survey spot checks: BaBar 2014 minimum 3.46 × 10⁻⁴ near 0.21 GeV (Fig. 4: ≈3.5 × 10⁻⁴); LHCb
              prompt ε² minimum 1.35 × 10⁻⁸ near 0.3 GeV (Fig. 2: ≈1.5 × 10⁻⁸); E137 tip 0.316 GeV; BaBar 2017 ε²
              5.0 × 10⁻⁷ at 2.4 GeV (2026-10-03)", "LHCb displaced map, the owner's two points: r = 0.4914 at
              250.1 MeV, ε = 3.575 × 10⁻⁵ and r = 0.5209 at 299.6 MeV, ε = 2.830 × 10⁻⁵, both excluded; its excluded
              island spans 0.218–0.313 GeV and ε = 1.16–6.56 × 10⁻⁵ (2026-10-13)"]
    notes: |
      The owner's review (2026-10-13) found:
      - LHCb's displaced file is an (m, ε, r) map, which ADROIT had read as ε bounds. It missed exclusions, and the plot
        showed r as if it were ε (the blue block and the turquoise rectangle). Now each search is drawn as its excluded
        region; for LHCb displaced that is the r = 1 contour.
      - The figure pointed to page 7 of arXiv:2005.01515, which explains kinetic mixing and cannot validate this
        compilation.
      - One Γ/m ≤ 10% gate for every search still allowed widths above an experiment's mass resolution.
      - A search outside its width gate had still been allowed to say "allowed" (a narrow peak as the most favourable
        signal). That is not established: a broader signal samples other masses, backgrounds and efficiencies,
        least of all for missing energy. At m_A′ = 5 GeV, m_χ = 1 GeV, g_D = 3, ε = 10⁻⁶ (Γ = 1.182 GeV, 23.6%)
        ADROIT returned allowed; it is now undecided.

      Caveats from reading each search's paper (details in data_file):
      - BaBar 2014 quotes its resolution only as 1.5–8 MeV, so ADROIT uses 1.5 MeV at every mass.
      - NA62's σ(M²) was read by eye from its Fig. 4, so it is approximate.
      - CHARM (Tsai et al. 2019) states no CL.
      - A1's 95% is its 2σ Feldman–Cousins interval.
      - LHCb prompt, CMS and HPS give no numerical mass resolution for their own search. ADROIT takes each from the
        same collaboration's other papers on the same data, or from HPS's one calibration point, always the smaller
        value (2026-10-13). The LHCb threshold value combines two "about" statements; CMS's 1.3% was measured below
        11 GeV with another muon ID; HPS has a single mass point.

