- id: M_scalar
  name: A scalar mediator
  layer: mediator
  description: A spin-0 mediator φ of mass m_med coupling as g_χ φ χ̄χ and g_N φ N̄N. Its exchange gives
    +g_χ g_N/m_med² × L01 with the propagator m_med²/(q² + m_med²), so a light mediator makes the interaction
    long-range.
  interaction: g_χ φ χ̄χ + g_N φ N̄N
  parameters:
  - name: g_chi
    unit: '1'
    default: 1.0
    description: the dark matter coupling
    prior: log_uniform
    low: 1.0e-06
    high: 12.566370614359172
  - name: gS_p
    unit: '1'
    default: 0.001
    description: the proton coupling
    prior: log_uniform
    low: 1.0e-06
    high: 12.566370614359172
  - name: gS_n
    unit: '1'
    default: 0.001
    description: the neutron coupling
    prior: log_uniform
    low: 1.0e-06
    high: 12.566370614359172
