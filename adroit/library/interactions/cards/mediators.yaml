- id: M_higgs_portal
  name: The Higgs portal (fermion dark matter)
  layer: mediator
  description: Dark matter coupling to the Higgs boson as y_χ h χ̄χ (for a singlet, from (H†H)χ̄χ/Λ with
    y_χ = v/Λ). The Higgs couples to nucleons as f_N m_N/v, with f_N from the light-quark σ-terms and
    the heavy-quark (gluon) contribution. Its exchange gives y_χ f_N m_N/(v m_h²) × L1.
  interaction: y_χ h χ̄χ + (f_N m_N/v) h N̄N
