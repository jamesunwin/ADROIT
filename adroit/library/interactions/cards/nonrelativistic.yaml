# Layer 1: the nonrelativistic operators O1, O3–O15 (arXiv:1308.6288, Eq. 15 and after).
# O2 has no leading-order nuclear response and is omitted, as there. The responses are
# those the rate code gives each operator (tests/library/test_interactions.py).
- id: O1
  name: 'O1: the spin-independent contact interaction'
  layer: nonrelativistic
  description: The nucleon-level operator O1 = 1_χ 1_N of the nonrelativistic effective theory, with separate
    proton and neutron coefficients.
  interaction: 1_χ 1_N
  parameters:
  - name: c_p
    unit: GeV^-2
    default: 1.6497719025367554e-05
    description: the proton coefficient (1/m_v^2 is weak strength)
  - name: c_n
    unit: GeV^-2
    default: 1.6497719025367554e-05
    description: the neutron coefficient
  terms:
  - target: O1
    factor: 1.0
    couplings:
    - c_{N}
  responses:
  - M
  isospin_variants: true
  kinematics:
  - elastic
  - inelastic
  - exothermic
  validity:
  - kind: contact
    note: 'a contact operator: the mediator must be much heavier than the momentum transfer, about 0.25
      GeV for a 250 keV recoil on xenon'
  constraint_tiers:
  - 1
  references:
  - arXiv:1203.3542
  - arXiv:1308.6288
