# Layer 2: the twenty relativistic interactions of arXiv:1308.6288, Table 1, with their
# nonrelativistic reductions (the column 'Σ c_i O_i'), in Bjorken–Drell conventions.
# Transcribed by hand from the TeX source of arXiv:1308.6288v1 (table:LWL); the five
# pairs LZ found to differ only by a constant (L1/L5, L2/L8, L3/L17, L4/L20, L11/L14)
# are the only proportional pairs, which the tests check.
- id: L01
  name: 'L1: χ̄χ N̄N'
  layer: relativistic
  description: The relativistic dark matter–nucleon interaction L1 of arXiv:1308.6288 (Table 1), for spin-1/2
    dark matter; its nonrelativistic limit is O1. P = p + p', K = k + k', q = p' − p.
  interaction: χ̄χ N̄N
  parameters:
  - name: d_p
    unit: GeV^-2
    default: 1.6497719025367554e-05
    description: the proton coupling d_j (1/m_v^2 is LZ's unit coupling)
  - name: d_n
    unit: GeV^-2
    default: 1.6497719025367554e-05
    description: the neutron coupling
  - name: m_M
    unit: GeV
    default: 246.2
    description: the scale in P/m_M, K/m_M and q/m_M; m_v by default, as LZ used
  terms:
  - target: O1
    factor: 1.0
    couplings:
    - d_{N}
    powers: {}
    q_power: 0
  parity_time: E/E
  isospin_variants: true
  kinematics:
  - elastic
  - inelastic
  - exothermic
  validity:
  - kind: contact
    note: 'a contact interaction: heavy mediator'
  - kind: spin_half
    note: written for spin-1/2 dark matter
  constraint_tiers:
  - 1
  - 2
  - 3
  references:
  - arXiv:1308.6288
