# Natural isotopic compositions, nuclear spins, and the targets built from them.
#
# Abundances are atom fractions: the IUPAC representative isotopic compositions
# (Meija et al., "Isotopic compositions of the elements 2013", Pure Appl. Chem.
# 88 (2016) 293). Checked against the element tables of WimPyDD 2.0.3, which
# agree to their rounding. Isotope masses are taken as A atomic mass units
# throughout (conventions.OPERATOR_MASS_GEV), which sets the mass fractions.

