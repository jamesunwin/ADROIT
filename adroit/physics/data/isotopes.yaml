# Compounds: atoms of each element per formula unit.
compounds:
  NaI: {Na: 1, I: 1}          # DAMA/LIBRA, COSINE, ANAIS
  CaWO4: {Ca: 1, W: 1, O: 4}  # CRESST
  C3F8: {C: 3, F: 8}          # PICO-60, PICO-500
  CF3I: {C: 1, F: 3, I: 1}    # PICO-60 (2016)

# Spin expectation values <S_p>, <S_n> for isotopes with spin but without
# shell-model responses. They set the approximate spin-dependent responses
# (nuclear.py). An isotope with spin that is not listed has no spin-dependent
# response.
spin_expectations:
  O17:
    proton: 0.0
    neutron: 0.5
    source: >-
      the value CRESST used (arXiv:1904.00498, section VI.2), citing the shell
      model of Pacheco & Strottman, Phys. Rev. D 40 (1989) 2131, and
      Bednyakov & Simkovic, Phys. Part. Nucl. 36 (2005) 131

# 183W is deliberately left without a spin-dependent response (owner's decision,
# 2026-09-29). No shell-model structure function exists for this heavy,
# deformed nucleus, and the published estimates of <S_n> span a factor of six:
# -0.031 (odd-group model, from its magnetic moment; hep-ph/0502232, Table II),
# -0.17 (single-particle shell model; hep-ph/0406218), average -0.1 (Del Nobile,
# arXiv:2104.12785, Table 9). CRESST (arXiv:1904.00498), RES-NOVA
# (arXiv:2601.16251) and the effective-operator reanalysis of CRESST-II
# (arXiv:1805.06113) all leave it out. Its spin-independent scattering is kept.
# 43Ca, 29Si and 13C likewise have no spin-dependent response here.
