source: Klos, Menendez, Gazit, Schwenk, Phys. Rev. D 88, 083516 (2013); arXiv:1304.7684v4, Appendix D
  (Tables IV-VIII), one- plus two-body currents
form: S_ij(u) = exp(-u) * sum_n c_ij,n u^n, u = p^2 b^2 / 2
notes:
- S11 and S01 are fitted at the two edges of the two-body-current band; S11 and |S01| grow together, so
  an edge pairs S11_min with the S01 of smaller magnitude. Combined so, S00 + S01 + S11 and S00 - S01
  + S11 reproduce the separate Sp and Sn fits to 0.5% of the larger of them, for every isotope.
- The b printed for 19F (1.8032 fm) equals that printed for 23Na; the paper's formula gives 1.762 fm for
  A = 19 and agrees with every other b to 0.1%. The printed value is kept, as the fit's variable u is
  defined by it.
- The fits cover the range of the paper's figures, u up to 5.
