    under SU(3)c, denoted by X." The χ–X interactions are left unspecified and assumed to keep χ and X in chemical equilibrium
    (standard coannihilation, single Boltzmann equation for Ỹ = Yχ + 2YX, eq. 3.3–3.5 with gχ = 2, gX = 3). EW quantum numbers
