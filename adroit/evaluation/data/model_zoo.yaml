    engine_options:
      sommerfeld: true
      bound_states: false
    mediator_ratio: 1.0001
    point:
      m_chi: 1700.0
      m_med: 1700.17
      g_chi: 0.1
    tied: chi_prime
  notes: 'Setup (p3): "We consider the possibility that the DM particle, stabilized by a discrete symmetry, is accompanied
    by a nearby coloured state χ′ ... Since we neglect any interaction between the SM and dark sectors, other than strong
    interactions, there are only two parameters relevant for our analysis: the DM mass MDM and the mass splitting ∆M". DM–χ′
    conversions assumed fast; one χ per χ′ decay.

    DM d.o.f. (p5): "For deﬁniteness, we assume that the DM particle is a Majorana fermion, such as the supersymmetric neutralino,
    or a complex scalar: gχ = 2 in both cases." gχ′ = {6, 8, 12, 16} for {S3, S8, F3, F8}; R = (1 + gχ/gχ′)^−1 at ∆M = 0 (eq.
    2.5).

    The paper neglects electroweak interactions of χ′ ("We neglected the electroweak contributions to the annihilation cross
    sections"), so χ′''s hypercharge/electric charge are left null here (the Fig. 1 label "Stopbino" suggests a right-handed-stop-like
    state). The DM mass target equals Mχ′ since ∆M = 0.

    Normalisation: "⟨σv⟩cosmo = (2.3 ± 0.1) × 10−26 cm3 s−1" (eq. 2.3) quoted for orientation; the exact ΩDM h2 used in Sec.
    2 is not stated (Sec. 4 normalises to ΩDMh2 = 0.1187). The "Sommerfeld included" value uses the running QCD potential
    and a thermal gluon mass m3 = √2 g3 T (p9). Bound-state formation is NOT included (compare entry coloured_coannihilation_bsf_harz).

    Footnote 1 (p4): their formulas agree with an earlier reference "taking into account that the parameter ⟨σAv⟩ there deﬁned
    equals 2 times the conventional ⟨σv⟩cosmo here employed."

    Library route: the S3M_uR partner with y = 0.1 stands in for the unspecified conversions; at ΔM = 0 its own annihilation
