    Correction (2026-10-14, the owner''s decision D9): each target now records the authors'' perturbative treatment (engine_options sommerfeld: false). The paper''s thermally averaged cross-section, eq. (26), has no Sommerfeld factor. Noticed after the G4 generic route refused the entry: with α_X = 0.5 the Sommerfeld effect is about a factor 1.4–1.9 here.

    Correction (2026-10-16, the owner''s decision D31): the paper''s relic formula, eq. (8) with eq. (9)''s g = 1, is the
    one for a self-conjugate particle, dn/dt = −⟨σv⟩(n² − n_eq²), applied to the φφ* cross section of eq. (28). For a
    complex scalar each annihilation removes one φ and one φ*, so the total n_φ + n_φ* obeys dn/dt = −(⟨σv⟩/2)(n² −
    n_eq²) and its Ωh² is twice the formula''s (x_f is unchanged: eq. (9) depends on g⟨σv⟩). The paper''s thermal
    target, Ωh² = 0.1199 in its counting, is therefore Ωh² = 0.2398 of φ and φ* together, the quantity ADROIT computes;
    the target''s value and uncertainty are doubled. Found by an independent calculation (the G12 closure record, the Feng
    question): the paper''s own method reproduces 0.112–0.120 at the four readings; ADROIT''s cross section matches the
    analytic one to under 1%; what remains is the paper''s freeze-out approximation (eqs. (8)–(9) against a full
    solution, −6% to −19%) and its non-relativistic average (−12% to +6%, by the resonance''s width). The doubled
    target is a derived convention conversion (the external audit''s A11, 2026-10-16): neither the paper''s native
    target nor a fresh blind reproduction, and its 58% uncertainty is the readings'' and the paper''s prescription''s,
    not a precision comparison.'
