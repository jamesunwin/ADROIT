    with gV per Table I: "mH2 [GeV] 200 300 400 500 / Γmin(H2) [GeV] 14.2 60.1 103.0 144.5 / gV 3.53 3.07 2.37 1.91". The
    intermediate points (300 GeV, gV = 3.07, Ωh2 = 1.60e-3; 400 GeV, gV = 2.37, Ωh2 = 3.05e-3) are extra checks.

    These are UNDER-abundant points (the paper: "the relic abundances of our DM particles are always below the measurement
    (Ωh2 0 = 0.1198)"), i.e. tests of the Ωh2 computation, not thermal-mass targets.

    Physics: "For all benchmark points, the DMs are dominantly annihilatting into WW∗ through scalar mediator(s) where W∗is
    the off-shell W boson" (p15). Since m_V = 80 GeV < m_W, the dominant channel is VV -> W W* (3-body final state) via s-channel
    H1 and H2 with destructive/constructive interference; a code restricted to on-shell 2-body final states will badly underestimate
    the annihilation rate and overestimate Ωh2. Set H2 widths consistently (the paper''s Γmin(H2) assumes H2 -> H1H1 negligible,
    footnote 3).

    Kinetic mixing of V with hypercharge is forbidden by an imposed Z2/charge conjugation (p5), so V is stable; there is no
    Z'' portal. The H1-H2 trilinear couplings (from λΦ, λHΦ) do not enter at m_V = 80 GeV because VV -> H1H1 is closed.

    The paper''s coefficient "-1/2 gV mV" for the H VV vertex should be cross-checked against D_mu Phi with Q_Phi = 1 (which
    gives g_V m_V phi V.V from |D Phi|^2); use the covariant derivative as the definition. v_h = 246 GeV assumed (not printed
    numerically).

    σ_SI is tabulated only as σ_SI^p × Ωh2/0.1198 (8.44e-10 pb at m_H2 = 200 GeV).

    At m_V = 80 GeV the relic is set by VV → WW* (off-shell W): beyond 2 → 2. The paper''s L^int prints the H–V–V coefficient
    as ½g_V m_V; the covariant derivative gives g_V m_V, which the typed model keeps. At m_H₂ = 200 GeV, λ_Φ ≈ 37 exceeds
    4π (the benchmark''s g_V = 3.53 is chosen for the H₂ width).

    G1 conventions (2026-10-13): Φ has its vacuum value v_φ = m_V/g_V (m_V = 80 GeV at both benchmarks), V''s mass comes from
    it, and λ_H is stated so that m_h₁ = 125 GeV after the h–φ mixing. The sign of λ_HΦ makes H₂ the heavier state for sin
    α > 0.

    Correction (2026-10-15, the owner''s decision D20): the quartic −λ_Φ(Φ†Φ − v_φ²/2)² was transcribed with one Φ† too
    few (Φ Φ† Φ Φ, net U(1)_X charge +2), so G1 refused the entry. Its fields are now Φ Φ† Φ Φ†, as eq. (II.8) prints it.
    The second benchmark (m_H₂ = 500 GeV, g_V = 1.91) kept the first one''s vacuum value v_φ = 80/3.53 GeV, so its V
    came out at 43 GeV; it now overrides v_φ = m_V/g_V = 80/1.91 GeV, as the notes above state (a target may now
    override a vacuum value). Each benchmark now also states m_H₁ = 125 GeV, the SM-like h''s mass the entry''s λ_H is
    set for (descriptive: it changes nothing computed). Found by G10''s intake gate, which compares specs only; the G4
    and G7 held-out runs refused the entry, so this entry is not blind at G12.'
