  notes: 'Two-component Weyl notation; doublets contracted with epsilon_ij. Paper: "We denote the singlet as S and the doublets
    as D and Dc ... with hypercharges −1/2 and +1/2 respectively" (Q = T3 + Y, no conversion needed). Neutral mass matrix
    in basis (S, ν, νc) is eq. (3) with off-diagonal entries λv/√2 and λ′v/√2.

    The benchmark sits at λ+ ≡ λ′ + λ = 0: the DM is ν1 = (νc + ν)/√2 with mass exactly M_D at tree level and vanishing ν1ν1h
    coupling (p9: "the condition for ν1ν1h cancellation to be λ′crit = −λ ⇒ λ+ = 0 (mν1 = MD)"); relic set by coannihilation
    with the charged Dirac state ψE (mass M_D) and the second neutral state, with "mν2 − mν1 ∼ 1 GeV". Physically this is
