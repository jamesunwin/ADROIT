    at:
      M_D: 91
      M_T: 91
      m: 140
    source:
      arxiv: '1403.7744'
      page: 20
      location: text below eq. (4.69), discussing Fig. 7b (MD = MT)
      quote: For mχ ≃ 91 GeV the correct density is obtained for m ≃ 140 GeV.
    tool: authors' tree-level calculation (Sec. 4)
