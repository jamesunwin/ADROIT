- id: dark_qed_bound_states_vonharling
  title: Dirac fermion DM with a massless dark photon (dark QED) including Sommerfeld and bound-state formation
  category: other
  in_library: false
  reference:
    arxiv: '1407.7874'
    title: Bound-state formation for thermal relic dark matter and unitarity
    first_author: Benedict von Harling
    year: 2014
  lagrangian:
    latex: \mathcal{L} = \bar X(iD\!\!\!/ - m)X - \frac{1}{4}F_{\mu\nu}F^{\mu\nu}, \qquad D_\mu = \partial_\mu + i g A_\mu,
      \quad \alpha \equiv g^2/(4\pi)
    equation: (2.1)
    page: 3
  needs:
  - annihilation_to_mediators
  - t_channel_exchange
  - sommerfeld
  - bound_states
  - new_gauge_group
  spec:
    phase: broken
    fields:
    - name: X
      role: dark_matter
      spin: 0.5
      mass_gev: 1040.0
      charges:
        extra:
          A_dark: 1.0
      dark_parity: -1
    - name: A_dark
      role: mediator
      spin: 1
      self_conjugate: true
      mass_gev: 0.0
      mass_justification: 'massless: the dark U(1) is unbroken'
    couplings:
    - name: g
      value: 0.5571259769340069
      justification: α = g²/4π = 0.0247
    terms:
    - fields:
      - field: X
        conjugate: true
      - field: X
      - field: A_dark
      lorentz: vector
      coupling: -g
      text: from D_μ = ∂_μ + i g A_μ
    stability: the dark U(1) charge
  targets:
  - quantity: thermal_mass_gev
    value: 1040.0
    at:
      alpha: 0.0247
    source:
      arxiv: '1407.7874'
      page: 9
      location: 'eq. (4.10) and following sentence: at m = m0 the fit gives alpha = alpha0 exactly'
      quote: We find that for m ≳ 100 GeV and up the unitarity bound (see below), the fit α = α0 (m/m0) [2/(1 + (m/m0)^r)]^s,
        (4.10) with α0 = 0.0247, m0 = 1.04 TeV, r = 1.28, s = 0.328, reproduces the values of α found numerically to better
        than 1% accuracy.
    tool: own coupled Boltzmann equations for X, para- and ortho-dark-positronium (eqs. 4.1-4.3)
    omega_target: 0.1209
  notes: 'The fit reproduces the solid line of Fig. 3, which includes BSF and the Sommerfeld effect on X Xbar -> 2 dark photons
    ("The solid blue line incorporates the effect of BSF and the SE of the direct DM annihilation into two dark photons.").
    Fit accuracy: better than 1% in alpha (so the thermal mass at fixed alpha is fixed to roughly ±1-2%).

    Target abundance is Omega (not Omega h^2): "We evaluate YX(zs), and determine α, such that the observed DM density, ΩX
    = ΩDM ≃ 0.26 [40], is reproduced." (p9; Planck 2013, h ≈ 0.67 → Omega h^2 ≈ 0.118). Omega_X counts X + Xbar (eq. 4.9).

    Strong assumptions to reproduce: "We take g∗= g∗S = 108.75 to account for the SM plus the two dark-photon degrees of freedom,
    and assume that g∗and g∗S remain constant." (p8); dark photons at the same temperature as the SM plasma; kinetic decoupling
    at z_kd (eq. 3.2) with DM temperature z_X = z^2/z_kd afterwards; BSF into the ground state only, with ionisation (Milne
    relation, eq. 2.14) and para/ortho decays tracked; integration from x_i = 5 to z_s = 100 z_kd.

    The fit (4.10) can be evaluated at other masses as an extra check (the authors quote < 1% accuracy for m from ~100 GeV
    up to the unitarity bound); only the m = m0 point is used as a target because there the paper''s printed numbers give
    alpha = alpha0 directly, with no evaluation needed. Unitarity bound quoted for Dirac DM: m^D_uni ≃ 139 TeV (eq. 5.1, p10).

    Ω_X = 0.26 with ρ_c ≃ 4.9 × 10⁻⁶ GeV cm⁻³ (h² = 0.465): Ωh² = 0.1209. The dark sector''s temperature is taken equal to
    the SM''s (constant g* = 108.75).'
