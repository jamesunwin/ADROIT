      page: 9
      location: table in eq. (2.26), column 'Scalar triplet', row 'MDM (Sommerfeld neglected)'
      quote: 'For vanishing mass splitting in the dark sector, ∆M = 0, the Sommerfeld corrections significantly increase the
        particle mass needed to reproduce the observed DM abundance: Scalar Fermion Scalar Fermion triplet triplet octet octet
        MDM (Sommerfeld neglected) 1.3 TeV 2.4 TeV 3.2 TeV 3.7 TeV MDM (Sommerfeld included) 1.7 TeV 4 −5 TeV 5 −6 TeV 7 −8
        TeV'
