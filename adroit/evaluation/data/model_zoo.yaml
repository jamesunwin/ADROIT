      treatment: QCD Sommerfeld included
    source:
      arxiv: '1402.6287'
      page: 9
      location: table in eq. (2.26), column 'Scalar triplet', row 'MDM (Sommerfeld included)'
      quote: MDM (Sommerfeld included) 1.7 TeV 4 −5 TeV 5 −6 TeV 7 −8 TeV
    tool: authors' numerical Boltzmann solution with QCD Sommerfeld factors from the full running-coupling potential with
