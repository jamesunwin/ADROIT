    Relic target used: Planck "Ωh2 = 0.1199 ± 0.0027" (eq. 4.69); the paper''s Fig. 7 draws the 2σ band as contours 0.115
    and 0.125, hence value 0.12 ± 0.005 here (the paper gives no Ωh2 number at the point itself).

    The paper states "Our calculation is a tree level one" and explicitly excludes MD < MZ (three-body final states); the
    second target (MD = MT ≃ 91 GeV) sits at that boundary and is read from text with "≃".

    The Fig. 1 benchmark lies at the upper MD edge of the allowed band of Fig. 7a (92 ≲ mχ ≲ 110 GeV for m = 200 GeV).

    The second point has M_D ≈ M_Z, which the authors say they do not treat.

    G1 conventions (2026-10-13): the Yukawas are written in invariant form; the signs reproduce the paper''s mass matrices,
    eq. (2.12). The doublets'' mass is the −M_D term alone.

    Re-read (2026-10-14, D12): the text''s point (m_χ ≃ 91, m ≃ 140) lies about 1 GeV outside Fig. 7b''s plotted region,
    whose 0.12 contour passes near M_D = M_T = 92 GeV, m ≈ 138.5 GeV. The second target keeps the text''s point, the
    paper''s own statement; no value was changed.'
