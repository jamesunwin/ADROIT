        T: 91.0
      couplings:
        Y1: 0.8041189999751576
        Y2: 0.8041189999751576
        M_D: 91.0
  notes: 'The paper uses Q = I3W + Y/2: "T ∼ (1c, 3)0L, D1 ∼ (1c, 2)+1R, D2 ∼ (1c, 2)−1R" (eq. 2.3) and in LH Weyl form "D̄1
    ∼ (1c, 2)−1, D̄2 ∼ (1c, 2)+1" (eq. 2.6). Converted here to Q = T3 + Y: D̄1 has Y = −1/2, D̄2 has Y = +1/2, T has Y = 0.
    Higgs normalised as H0 = v + h/√2 with v ≃ 174 GeV ("Y = m/v ≃ 200/174 ≃ 1.15", p15).

    Custodial limit Y1 = Y2 ≡ Y (m1 = m2 = m): the eigenvalue MD decouples, so mχ01 = MD exactly and the χ01χ01Z and χ01χ01h
    tree couplings vanish; annihilation only via t/u-channel χχ → W+W−, ZZ (eqs. 4.66–4.67). Fig. 1 caption: "The lightest
    neutral particle, χ0 1 is an equal admixture of the two doublets and has mass MD" (its hypercharge entry 0.0 here is nominal;
    chi_pm is a doublet-triplet mixture listed with triplet quantum numbers). Fig. 1 spectrum for the benchmark: χ01 at 110
