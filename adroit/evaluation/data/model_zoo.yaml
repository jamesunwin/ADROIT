      text: κ V_ν ∂_μF^{μν} = −(κ/2)V_{μν}F^{μν} + total derivative
    stability: the dark U(1)′ charge
  targets:
  - quantity: sigma_v_cm3_s
    value: 2.5e-26
    at:
      m_psi: 270.0
      alpha_prime: 0.01
      m_V: 1.0
      kappa: 1.0e-06
      chosen by the zoo: 'm_ψ = 270 GeV, α′ = 0.01 (the paper''s relic relation), m_V = 1 GeV (the paper''s limit m_V → 0)
        and κ = 10⁻⁶ (the paper''s κ ≪ 1, small only so that V decays)'
    source:
      arxiv: '0810.1502'
      page: 5
      location: eq. (7) and the sentence before it
      quote: 'Assuming that ψ (or φ) is the dominant component of dark matter, and relating the cross section to the measured
        cold dark matter energy density, we obtain: 10^−10 x_f / (sqrt(g∗(T_f)) × ⟨σv⟩) ≤ Ω_DM h^2 ≈ 0.1 =⇒ ⟨σv⟩ = 2.5 × 10−26
        cm3s−1, (7)'
    tool: analytic freeze-out estimate (x_f ~ 20, g* ~ O(100))
  - quantity: thermal_mass_gev
    value: 270.0
    at:
      alpha_prime: 0.01
      m_V: 0.0
    source:
      arxiv: '0810.1502'
      page: 5
      location: eq. (8) (fermionic WIMP relation) and preceding sentence
      quote: Eq. (7) implies that in the limit of small mixing, κ ≪1, the correct dark matter abundance is achieved if the
        WIMP masses and couplings satisfy the relation(s) α′ ≃ 10^−2 × (mψ / 270 GeV), α′ ≃ 10^−2 × (mφ / 380 GeV). (8) (These
        formulae also correct a small numerical error in Eq. (13) of Ref. [3].)
    tool: analytic freeze-out estimate
    omega_target: 0.1
  notes: 'Annihilation that sets the abundance is psi psibar -> V V (t/u-channel psi exchange), with spin-averaged cross section
    (eq. 6, p5) sigma v|^{+-}_{2V} = pi alpha''^2/m_psi^2 sqrt(1 - m_V^2/m_psi^2) -> pi alpha''^2/m_psi^2 for m_V << m_psi.

    Convention: the paper''s <sigma v> in eq. (7) is the average over +-, ++ and -- collisions, <sigma v> = (1/2) sigma v|^{+-}_{2V};
    the target 2.5e-26 cm^3/s therefore corresponds to sigma v|^{+-} = 5e-26 cm^3/s. Check: pi*(0.01)^2/(270 GeV)^2 = 4.3e-9
    GeV^-2 = 5.0e-26 cm^3/s, consistent.

    The paper normalises to Omega_DM h^2 ≈ 0.1 (old WMAP-era value), not 0.12; rescale by ~0.1/0.12 in <sigma v> (or ~sqrt
    of that in alpha'') when comparing to a modern code. Target is an analytic order-of-magnitude-level estimate; allow O(10-20%)
    tolerance.

    For a complex scalar WIMP phi, eq. (6) is multiplied by 2, giving the second relation alpha'' ≃ 1e-2 (m_phi/380 GeV).

    This paper explicitly corrects eq. (13) of the original secluded-WIMP paper (Pospelov, Ritz, Voloshin, arXiv:0711.4866,
    PDF p7), which reads "α′ × (1 − m_V^2/m_ψ^2)^{1/4} ≃ 5 × 10^−3 × (m_ψ/500 GeV)"; that older relation is low by a factor
    ~3.5 in alpha'' and should NOT be used as a target. The original PRV Lagrangian (eq. 2 of 0711.4866) is the same model
    with kinetic mixing written as -(kappa/2) V_{mu nu} B^{mu nu} with hypercharge.

    The dark Higgs h'' and the mixing kappa are irrelevant for the relic density in the secluded limit (they only need V and
    h'' to decay before BBN); DM stability is from the unbroken DM-number (U(1)'' charge) — dark_parity -1 is assigned to
    psi as an effective Z2 label.

    The thermal mass is the paper''s analytic estimate from ⟨σv⟩ = 2.5 × 10⁻²⁶ cm³/s (ψψ̄ → VV), normalised to Ωh² ≈ 0.1;
    the earlier 0711.4866 eq. (13) is not used.

    G1 conventions (2026-10-13): the unspecified kinetic mixing kappa is set to 1e-06 (small, only so that V decays; the paper''s
    κ ≪ 1).'
