# The model zoo (G0): freeze-out models from the literature with published targets.
# Built 2026-10-13 from a literature survey (every target's quote checked against its PDF);
# docs/model_zoo.md gives the rules. Edit an entry only to correct it, never after seeing a result.
entries:
- id: inert_doublet_kalinowski
  title: Inert doublet model (IDM) e+e- benchmark points
  category: extended_higgs
  in_library: true
  library: inert_doublet
  reference:
    arxiv: '1809.07712'
    title: Benchmarking the Inert Doublet Model for e+e- colliders
    first_author: Jan Kalinowski
    year: 2018
  lagrangian:
    latex: V = -\frac{1}{2}\left[m_{11}^2(\phi_S^\dagger\phi_S) + m_{22}^2(\phi_D^\dagger\phi_D)\right] + \frac{\lambda_1}{2}(\phi_S^\dagger\phi_S)^2
      + \frac{\lambda_2}{2}(\phi_D^\dagger\phi_D)^2 + \lambda_3(\phi_S^\dagger\phi_S)(\phi_D^\dagger\phi_D) + \lambda_4(\phi_S^\dagger\phi_D)(\phi_D^\dagger\phi_S)
      + \frac{\lambda_5}{2}\left[(\phi_S^\dagger\phi_D)^2 + (\phi_D^\dagger\phi_S)^2\right]
    equation: (2)
    page: 2
  needs:
  - perturbative_s_channel
  - coannihilation
  - ewsb_mixing
  spec:
    phase: unbroken
    fields:
    - name: phi_D
      role: dark_matter
      spin: 0
      mass_gev: 73.68218992050234
      mass_justification: μ₂ = √(M_H² − λ₃₄₅v²/2), the inert doublet's mass parameter (V ⊃ μ₂²|φ_D|², μ₂² = −m₂₂²/2); M_H²
        = μ₂² + λ₃₄₅v²/2, M_A² = μ₂² + (λ₃+λ₄−λ₅)v²/2, M_H±² = μ₂² + λ₃v²/2 (v = 246.22 GeV)
      charges:
        su2: 2
        hypercharge: 0.5
      dark_parity: -1
    - name: H
      role: standard_model
      spin: 0
      charges:
        su2: 2
        hypercharge: 0.5
    couplings:
    - name: lam2
      value: 1.44513
      justification: from the benchmark's M_H, M_A, M_H±, λ₂, λ₃₄₅
    - name: lam3
      value: 0.254454356205408
      justification: from the benchmark's M_H, M_A, M_H±, λ₂, λ₃₄₅
    - name: lam4
      value: -0.1545134435588876
      justification: from the benchmark's M_H, M_A, M_H±, λ₂, λ₃₄₅
    - name: lam5
      value: -0.10434814264652045
      justification: from the benchmark's M_H, M_A, M_H±, λ₂, λ₃₄₅
    terms:
    - fields:
      - field: phi_D
      - field: phi_D
        conjugate: true
      - field: phi_D
      - field: phi_D
        conjugate: true
      lorentz: scalar
      coupling: -lam2/2
      text: −(λ₂/2)(φ_D†φ_D)²
    - fields:
      - field: H
      - field: H
        conjugate: true
      - field: phi_D
      - field: phi_D
        conjugate: true
      lorentz: scalar
      coupling: -lam3
      text: −λ₃(φ_S†φ_S)(φ_D†φ_D)
      indices: H*[i] H[i] phi_D*[j] phi_D[j]
    - fields:
      - field: H
        conjugate: true
      - field: phi_D
      - field: phi_D
        conjugate: true
      - field: H
      lorentz: scalar
      coupling: -lam4
      text: −λ₄(φ_S†φ_D)(φ_D†φ_S)
      indices: H*[i] phi_D[i] phi_D*[j] H[j]
    - fields:
      - field: H
        conjugate: true
      - field: H
        conjugate: true
      - field: phi_D
      - field: phi_D
      lorentz: scalar
      coupling: -lam5/2
      plus_hc: true
      text: −(λ₅/2)[(φ_S†φ_D)² + h.c.]
      indices: H*[i] phi_D[i] H*[j] phi_D[j]
    stability: 'Z2: φ_D → −φ_D'
    assumptions:
    - φ_S is the Standard Model Higgs doublet H
  targets:
  - quantity: omega_h2
    value: 0.12007
    at:
      M_H: 72.77
      M_A: 107.803
      M_Hpm: 114.639
      lambda_2: 1.44513
      lambda_345: -0.00440723
      M_h: 125.1
    source:
      arxiv: '1809.07712'
      page: 10
      location: Table 1, row BP1
      quote: BP1 72.77 107.803 114.639 1.44513 -0.00440723 0.12007
    tool: micrOMEGAs 4.3.5
    point:
      m_chi: 72.77
      m_med: 114.639
      g_chi: -0.00440723
      g_q: 35.033
  - quantity: omega_h2
    value: 0.12478
    at:
      M_H: 990
      M_A: 992.36
      M_Hpm: 998.12
      lambda_2: 3.3345
      lambda_345: -0.051
      M_h: 125.1
    source:
      arxiv: '1809.07712'
      page: 14
      location: Table 4, row HP10
      quote: HP10 990 992.36 998.12 3.3345 -0.051 0.12478
    tool: micrOMEGAs 4.3.5
    overrides:
      masses:
        phi_D: 990.7804574976113
      couplings:
        lam2: 3.3345
        lam3: 0.48157797236064104
        lam4: -0.4554078640750093
        lam5: -0.07717010828563171
    point:
      m_chi: 990.0
      m_med: 998.12
      g_chi: -0.051
      g_q: 2.36
  notes: 'Table columns (verbatim header): "No. MH MA MH± Z W DM λ2 λ345 ΩHh2" (the Z/W/DM columns are on-shell/>50% check-marks,
    lost in text extraction).

    Table 1 caption: "In all benchmarks Mh = 125.1 GeV. Bold font denotes BP with 100% DM relic density."; Table 4 caption:
    "HP10 provides exact relic density."

    Planck value used by the authors: "Ωc h2 = 0.1197 ± 0.0022" (eq. 11, p5), required within 2 sigma for 100% DM.

    BP1 (M_H = 72.77 GeV) sits just below the WW threshold where 3-body WW* final states matter; HP10 (990 GeV) is a compressed-spectrum
    point with strong coannihilation (Delta M ~ 2-8 GeV).

    Five free parameters after EWSB are (M_H, M_A, M_H±, λ2, λ345) with λ345 = λ3 + λ4 + λ5; the DM is the CP-even H. lambda_2
    does not affect the relic density at tree level.

    Components H, A, H± are listed with their parent-doublet quantum numbers (su2 = 2, Y = 1/2) and their broken-phase electric
    charge.

    BP1 sits below the WW threshold (M_H = 72.77 GeV), where the off-shell WW* channel matters: beyond 2 → 2.

    G1 conventions (2026-10-13): the λ₃, λ₄, λ₅ terms state their SU(2) contractions.'
- id: scalar_singlet_higgs_portal_gambit
  title: Real scalar singlet (Z2) Higgs-portal dark matter, GAMBIT best-fit points
  category: higgs_portal
  in_library: true
  library: higgs_portal_scalar
  reference:
    arxiv: '1705.07931'
    title: Status of the scalar singlet dark matter model
    first_author: Peter Athron (GAMBIT Collaboration)
    year: 2017
  lagrangian:
    latex: \mathcal{L} = \frac{1}{2}\mu_S^2 S^2 + \frac{1}{2}\lambda_{hS} S^2 |H|^2 + \frac{1}{4}\lambda_S S^4 + \frac{1}{2}\partial_\mu
      S \partial^\mu S, \qquad m_S = \sqrt{\mu_S^2 + \frac{1}{2}\lambda_{hS} v_0^2}
    equation: (1), (2)
    page: 3
  needs:
  - perturbative_s_channel
  - resonance
  - ewsb_mixing
  spec:
    phase: unbroken
    fields:
    - name: S
      role: dark_matter
      spin: 0
      self_conjugate: true
      mass_gev: 9785.199671960123
      mass_justification: μ_S = √(m_S² − λ_hS v²/2), the Lagrangian mass of m_S = 9.79 TeV
      dark_parity: -1
    - name: H
      role: standard_model
      spin: 0
      charges:
        su2: 2
        hypercharge: 0.5
    couplings:
    - name: lam_hS
      value: 3.1
    terms:
    - fields:
      - field: H
      - field: H
        conjugate: true
      - field: S
      - field: S
      lorentz: scalar
      coupling: -lam_hS/2
      text: '−½λ_hS S²|H|² (GAMBIT''s eq. (1) is written as L with potential signs: V ⊃ ½λ_hS S²|H|²)'
    stability: 'Z2: S → −S'
    dropped:
    - the singlet quartic ¼λ_S S⁴ (irrelevant to the relic density at tree level)
  targets:
  - quantity: omega_h2
    value: 0.1131
    at:
      m_S: 9790.0
      lambda_hS: 3.1
    source:
      arxiv: '1705.07931'
      page: 13
      location: Table 5, row 'High mass / Best fit / ΩSh2 ∼ ΩDMh2'
      quote: Best fit ΩSh2 ∼ΩDMh2 3.1 9.790 × 103 0.1131 4.311 0.362
    tool: GAMBIT 1.0 DarkBit; effective rate W_eff passed to the DarkSUSY Boltzmann solver
    point:
      m_chi: 9790.0
      m_med: 125.09
      g_chi: 3.1
  - quantity: omega_h2
    value: 0.1129
    at:
      m_S: 62.27
      lambda_hS: 0.00029
    source:
      arxiv: '1705.07931'
      page: 13
      location: Table 5, row 'Low mass / Best fit / ΩSh2 ∼ ΩDMh2'
      quote: Low mass Best fit ΩSh2 ≲ΩDMh2 6.5 × 10−4 62.51 0.0179 4.566 0.107 Best fit ΩSh2 ∼ΩDMh2 2.9 × 10−4 62.27 0.1129
        4.431 0.242
    tool: GAMBIT 1.0 DarkBit; effective rate W_eff passed to the DarkSUSY Boltzmann solver
    overrides:
      masses:
        S: 62.19937622816899
      couplings:
        lam_hS: 0.00029
    point:
      m_chi: 62.27
      m_med: 125.09
      g_chi: 0.00029
  notes: 'Table 5 column header (verbatim): "Mode Statistic Relic density condition λhS mS (GeV) ΩSh2 log(L) ∆ln L".

    Text p12: "In the high-mass region, the best fit able to reproduce the entire observed relic density is at λhS = 3.1,
    mS = 9.79 TeV"; "the best fit occurs at the bottom of the resonance, at λhS = 2.9× 10−4, mS = 62.27 GeV".

    Relic criterion: "ΩSh2 within 1σ of the Planck value ΩDMh2 = 0.1188 ± 0.006 (the uncertainty includes theoretical and
    observational contributions added in quadrature)" (p12).

    The paper writes eq. (1) as "L =" with all-positive signs; the mass relation eq. (2) shows the S^2 and S^2|H|^2 terms
    act as potential terms (V convention), so the hSS coupling is -lambda_hS v0 h S^2/2 in the Lagrangian. v0 = 246 GeV.

    Best-fit points come with 13 nuisance parameters (Higgs mass, quark masses, alpha_s, nuclear and halo inputs) that "do
    not deviate significantly from the central values"; the resonance point (m_S = 62.27 GeV, just above m_h/2 with m_h ~
    125 GeV) is extremely sensitive to m_h and Gamma_h, and to the treatment of the thermal average across the Higgs pole.
    The high-mass point has a large coupling (3.1) and is dominated by s-channel h, contact and t/u-channel h exchange into
    hh, WW, ZZ, tt.

    Partial cross sections (p7): annihilation rates from the paper''s eq. (5) (off-shell Higgs width trick), with "For mS
    < 150 GeV we use the SM Higgs partial widths contained in DecayBit", "whereas for mS > 150 GeV we revert to the tree-level
    expressions from Appendix A of Ref. [26]", plus the hh channel for mS > mh.

    G1 conventions (2026-10-13): S''s mass is the Lagrangian μ_S; the λ_S term is dropped.'
- id: wino_majorana_triplet_bottaro
  title: Pure wino (Majorana SU(2)_L triplet, Y = 0) thermal mass with Sommerfeld and bound states
  category: electroweak_multiplet
  in_library: true
  library: wino
  reference:
    arxiv: '2107.09688'
    title: Closing the window on WIMP Dark Matter
    first_author: Salvatore Bottaro
    year: 2021
  lagrangian:
    latex: \mathcal{L}_f = \frac{1}{2}\chi\left(i\bar\sigma^\mu D_\mu - M_\chi\right)\chi, \qquad D_\mu = \partial_\mu - i
      g_2 W^a_\mu T^a_\chi
    equation: (2)
    page: 2
  needs:
  - coannihilation
  - sommerfeld
  - bound_states
  - ewsb_mixing
  spec:
    phase: unbroken
    fields:
    - name: chi
      role: dark_matter
      spin: 0.5
      self_conjugate: true
      mass_gev: 2860.0
      mass_justification: M_χ, the triplet's mass
      charges:
        su2: 3
      dark_parity: -1
    stability: 'Z2 (R-parity-like): χ → −χ'
  targets:
  - quantity: thermal_mass_gev
    value: 2860.0
    uncertainty: 10.0
    at: {}
    source:
      arxiv: '2107.09688'
      page: 3
      location: Table I, row 'Majorana fermion, n = 3'
      quote: Majorana fermion 3 2.86 ± 0.01
    tool: authors' own coupled Boltzmann (DM + bound states) solution with electroweak Sommerfeld enhancement and bound-state
      formation
    omega_target: 0.1193
    point:
      m_chi: 2860.0
      m_med: 1.0
      g_q: 0.0
  - quantity: thermal_mass_gev
    value: 2880.0
    at:
      M1_over_M2: 3
      mu_over_M2: 2
      M_sf: 20000.0
    source:
      arxiv: '1601.04718'
      page: 2
      location: Introduction, p. 2
      quote: we find that the observed relic density is attained at significantly larger mass mχ = 2.88 TeV when the Sommerfeld
        effect is accounted for, instead of 2.22 TeV at tree level, when M1 = 3M2, µ = 2M2 and the common sfermion mass Msf
        = 20 TeV, which corresponds effectively to the pure-wino limit.
    tool: Beneke et al. NR-EFT Sommerfeld code (no bound-state formation) + micrOMEGAs/FeynHiggs MSSM inputs; Ωh2 = 0.1188
    omega_target: 0.1188
    point:
      m_chi: 2880.0
      m_med: 1.0
      g_q: 0.0
  notes: 'Two-component (Weyl) notation; T^a_chi are SU(2) generators in the n = 3 representation; Q = T3 + Y with Y = 0.

    Bottaro et al. fit to "ΩDMh2 = 0.11933 ± 0.00091" (p1). Table I caption: "The annihilation cross-section includes both
    the contribution of SE and BSF." For the 3-plet BSF is a small effect; the result is dominated by Sommerfeld-enhanced
    chi chi -> WW, ZZ, Z gamma, gamma gamma co-annihilations with chi+-.

    Radiative splitting quoted as "MQ −M0 ≃ Q^2 αem mW / (2(1 + cos θW)) = Q2 ×(167 ± 4) MeV" (eq. 3, p2); Beneke et al. use
    the two-loop-corrected pure-wino splitting near 160 MeV and Ωh2|exp = 0.1188 ± 0.0010 (p21).

    The second target (2.88 TeV) is an MSSM computation in the pure-wino limit with Sommerfeld but without bound states; tree
    level gives 2.22 TeV. The Sommerfeld resonance near 2.33 TeV (Beneke p2) makes the relic density non-monotonic in the
    mass, so a code must handle the zero-energy-resonance region.'
- id: higgsino_dirac_doublet_bottaro
  title: Pure higgsino (Dirac SU(2)_L doublet, Y = 1/2) thermal mass
  category: electroweak_multiplet
  in_library: true
  library: higgsino
  reference:
    arxiv: '2205.04486'
    title: The last Complex WIMPs standing
    first_author: Salvatore Bottaro
    year: 2022
  lagrangian:
    latex: \mathscr{L}_D = \overline{\chi}\left(i\slashed{D} - M_\chi\right)\chi + \frac{y_0}{\Lambda_{UV}^{4Y-1}}\mathcal{O}_0
      + \frac{y_+}{\Lambda_{UV}}\mathcal{O}_+ + \mathrm{h.c.}, \quad \mathcal{O}_0 = \frac{1}{2(4Y)!}\left(\overline{\chi}(T^a)^{2Y}\chi^c\right)\left[(H^{c\dagger})\frac{\sigma^a}{2}H\right]^{2Y},
      \quad \mathcal{O}_+ = -\overline{\chi}T^a\chi H^\dagger\frac{\sigma^a}{2}H
    equation: (1)
    page: 3
  needs:
  - coannihilation
  - sommerfeld
  - bound_states
  - ewsb_mixing
  - higher_dimensional_operator
  spec:
    phase: unbroken
    fields:
    - name: chi
      role: dark_matter
      spin: 0.5
      mass_gev: 1080.0
      mass_justification: M_χ, the doublet's Dirac mass
      charges:
        su2: 2
        hypercharge: 0.5
      dark_parity: -1
    - name: H
      role: standard_model
      spin: 0
      charges:
        su2: 2
        hypercharge: 0.5
    couplings: []
    terms: []
    stability: 'Z2: χ → −χ'
    dropped:
    - 'the splitting operators O₀ and O₊: free within the paper''s viable window, and the thermal mass does not depend on
      them (they set the small splittings that G8 needs)'
  targets:
  - quantity: thermal_mass_gev
    value: 1080.0
    uncertainty: 20.0
    at: {}
    source:
      arxiv: '2205.04486'
      page: 2
      location: Table I, row 'Dirac fermion 2_{1/2}'
      quote: Dirac fermion 21/2 1.08 ± 0.02 > MPl - 0.22 - 2 × 104 107 4.8 - 104
    tool: authors' own computation including Sommerfeld enhancement and bound-state formation
    omega_target: 0.1193
    point:
      m_chi: 1080.0
      m_med: 1.0
      g_q: 0.0
  notes: 'Table I header: "DM spin nY MDM (TeV) ΛLandau/MDM (σv)J=0 tot /(σv)J=0 max δm0 [MeV] Λmax UV /MDM δmQM [MeV]"; caption:
    "Thermal masses of complex WIMPs with Y ≠ 0, obtained including Sommerfeld enhancement and BSF."

    Relic target: "ΩDMh2 = 0.11933 ± 0.00091" (p1).

    For the 2_{1/2} the viable window of the neutral splitting is delta_m0 = 0.22 MeV - 2e4 MeV and of the charged splitting
    delta_m_QM = 4.8 MeV - 1e4 MeV (Table I); the pure electroweak charged splitting is 354 MeV (p7: "354 MeV for 21/2").
    The thermal mass is insensitive to these splittings in the quoted window (Appendix B 3).

    Q = T3 + Y convention (stated p3). With Y = 1/2 the operator O_0 is dimension 5 (Lambda_UV^{4Y-1} = Lambda_UV).

    Note: the paper writes the conjugate field as chi-bar in O_0 and O_+; the fermion is Dirac (4-component).

    G1 conventions (2026-10-13): the splitting operators O₀ and O₊ are dropped (their couplings are free and do not set the
    thermal mass).'
- id: dmwg_dirac_vector_zprime_v1
  title: Dirac fermion DM with s-channel vector Z′ coupled to quarks (LHC DM WG scenario V1)
  category: vector_mediator
  in_library: true
  reference:
    arxiv: '1703.05703'
    title: 'Recommendations of the LHC Dark Matter Working Group: Comparing LHC searches for heavy mediators of dark matter
      production in visible and invisible decay channels'
    first_author: Andreas Albert
    year: 2017
  lagrangian:
    latex: \mathcal{L}_{\rm vector} = -g_{\rm DM} Z'_\mu \bar\chi\gamma^\mu\chi - g_q \sum_{q=u,d,s,c,b,t} Z'_\mu \bar q\gamma^\mu
      q - g_\ell \sum_{\ell=e,\mu,\tau} Z'_\mu \bar\ell\gamma^\mu\ell
    equation: (2.1)
    page: 5
  needs:
  - perturbative_s_channel
  - resonance
  - annihilation_to_mediators
  spec:
    phase: broken
    fields:
    - name: chi
      role: dark_matter
      spin: 0.5
      mass_gev: 715.0
      dark_parity: -1
    - name: Zp
      role: mediator
      spin: 1
      self_conjugate: true
      mass_gev: 3000.0
    - name: q
      role: standard_model
      spin: 0.5
      charges:
        su3: '3'
    - name: l
      role: standard_model
      spin: 0.5
    couplings:
    - name: g_DM
      value: 1.0
    - name: g_q
      value: 0.25
    - name: g_l
      value: 0.0
    terms:
    - fields:
      - field: chi
        conjugate: true
      - field: chi
      - field: Zp
      lorentz: vector
      coupling: -g_DM
      text: −g_DM Z′_μ χ̄γ^μχ
    - fields:
      - field: q
        conjugate: true
      - field: q
      - field: Zp
      lorentz: vector
      coupling: -g_q
      text: −g_q Σ_q Z′_μ q̄γ^μq
    - fields:
      - field: l
        conjugate: true
      - field: l
      - field: Zp
      lorentz: vector
      coupling: -g_l
      text: −g_ℓ Σ_ℓ Z′_μ ℓ̄γ^μℓ
    stability: 'Z2: χ → −χ'
  targets:
  - quantity: thermal_mass_gev
    value: 715.0
    uncertainty: 25.0
    at:
      M_med: 3000.0
      g_DM: 1.0
      g_q: 0.25
      g_l: 0.0
    source:
      arxiv: '1703.05703'
      page: 12
      location: Fig. 2 top-left (scenario V1), Ωh2 = 0.118 contour, x-axis m_med [GeV] (linear 0-5000), y-axis m_DM [GeV]
        (linear 0-2500) (read from curve)
      quote: The contour lines correspond to the region of parameter space where the relic density is consistent with the
        value Ωh2 = 0.118.
    tool: MadDM 2.0.6 with DMsimp 2.0 (UFO)
    omega_target: 0.118
  - quantity: thermal_mass_gev
    value: 358.0
    uncertainty: 20.0
    at:
      M_med: 2000.0
      g_DM: 1.0
      g_q: 0.25
      g_l: 0.0
    source:
      arxiv: '1703.05703'
      page: 12
      location: Fig. 2 top-left (scenario V1), Ωh2 = 0.118 contour at m_med = 2000 GeV (read from curve)
      quote: 'Top left: scenario V1, vector mediator with couplings only to quarks (gq = 0.25).'
    tool: MadDM 2.0.6 with DMsimp 2.0 (UFO)
    omega_target: 0.118
    overrides:
      masses:
        Zp: 2000.0
        chi: 358.0
  notes: 'CURVE READING: the paper gives only contours. I digitised the raster figure (page 12 rendered at 6x; frame calibrated
    on the axis lines: m_med = 0 at x = 665.5 px, 5000 GeV at 1534.5 px; m_DM = 0 at y = 1652.5 px, 2500 GeV at 538 px) and
    took the orange Ωh2 = 0.118 contour pixels. Readings: m_med = 2000 -> m_DM ~ 358 GeV; 3000 -> ~715 GeV; 4500 -> ~1340
    GeV; 5000 -> ~1540 GeV. Quoted uncertainty is line width + calibration (+-20-25 GeV), not physics.

    The contour is the lower branch (m_DM < M_med/2): DM is overproduced below/right of it ("all models predict an overabundance
    of DM for Mmed ≫mDM").

    DM is a Dirac fermion (p4: "assume that DM is a Dirac fermion χ"); relic target Ωh2 = 0.118 (Planck). Mediator width:
    "the DMsimp model was modified to use the mediator width formulas" (minimal width, eqs. 2.4-2.7). The earlier LHC DM WG
    relic curves "used an earlier version of MadDM which did not include t-channel annihilation to pairs of mediators" (p11);
    irrelevant on the V1 lower branch where m_DM < M_med.

    Couplings: all quark flavours equal g_q (incl. top); g_l = 0 for V1.

    Library tag "in_library: true" assumes this is the code''s LHC DM WG vector benchmark.'
- id: real_scalar_quintuplet_bottaro
  title: Real scalar SU(2)_L 5-plet (Y = 0) electroweak WIMP
  category: electroweak_multiplet
  in_library: false
  reference:
    arxiv: '2107.09688'
    title: Closing the window on WIMP Dark Matter
    first_author: Salvatore Bottaro
    year: 2021
  lagrangian:
    latex: \mathcal{L}_s = \frac{1}{2}(D_\mu\chi)^2 - \frac{1}{2}M_\chi^2\chi^2 - \frac{\lambda_H}{2}\chi^2|H|^2 - \frac{\lambda_\chi}{4}\chi^4,
      \qquad D_\mu = \partial_\mu - i g_2 W^a_\mu T^a_\chi
    equation: (1)
    page: 2
  needs:
  - coannihilation
