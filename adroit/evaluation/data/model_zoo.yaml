      y2: 'not printed: any value ≲ 4×10⁻³ (p7–9, ''the dark matter constraint does not restrict the possible values of y1
        and y2''); 1×10⁻⁵ used here'
    source:
      arxiv: '1510.06151'
      page: 7
      location: text, Sec. 4, second paragraph (describing Fig. 2); two sentences of the same paragraph joined by '…'
      quote: From the figure we see that the upper bound on MD , MS is of order 750 GeV, consistent with our estimate in the
        previous section. … Close to Mχ1 ∼ 750 GeV, the mass difference between χ1 and χ2 becomes negligible.
    tool: micrOMEGAs with LanHEP ("For the calculation of the relic density we have used micrOMEGAs [17](and LanHEP [18]),
      which automatically takes into account all coannihilation processes", p7; ref. [17] is the micrOMEGAs 3.1 paper, the
      version run is not stated); tree-level 2→2 annihilation, no Sommerfeld effect; the upper bound on the dark matter mass
      is reached as M_D → M_S, taken here as M_D = 1.0001 M_S (mediator_ratio), as in the coloured-coannihilation entries
    engine_options:
      sommerfeld: false
    omega_target: 0.12
    mediator_ratio: 1.0001
    overrides:
      masses:
        chi0: 750.0
        N: 750.075
    scan: chi0
    tied: N
  notes: 'Model (p3, eq. 1): "two Dirac fermions: an SU (2) doublet with Y = −1/2, ψL,R , and a singlet, SL,R". A doublet
    with a neutral member at Y = −1/2 is the Q = T3 + Y convention, so no hypercharge conversion: N ≡ ψ = (ψ⁰, ψ⁻) with Y
    = −1/2, chi0 ≡ S. The charged member is named χ+ in the paper, "with mass Mχ+ = MD + 341 MeV" (p4); the 341 MeV is the
    radiative splitting, which the typed model (tree level, M_χ± = M_D) leaves out.

    Higgs conjugate: the paper prints "H̃ = iσ2 H" (p3). Hypercharge needs iσ2H* (ψ̄_L H̃ S_R must have Y = 0), which is used
    here; with ⟨H⁰⟩ = v/√2 it reproduces the paper''s mass matrix. Index contraction ε₁₂ = +1: ψ̄_i H̃_i = ε_ij ψ̄_i H*_j
    = ψ̄⁰H⁰* − ψ̄⁻H⁻.

    Yukawa normalisation: eq. (2) (p4), basis (S, ψ), has rows (MS, y2 v/√2) and (y1 v/√2, MD), "where v = 246 GeV"; rows
    are the left-handed and columns the right-handed states (Md = UL† M UR, eq. 3). This is ⟨H⁰⟩ = v/√2, v = 246 GeV, the
    same as ADROIT''s, so y₁, y₂ are used as printed. Check: tan 2θL = √2v(MS y1 + MD y2)/(MD² − MS² + v²(y1² − y2²)/2) (eq.
    5) is the (1,2) element of M M† over the difference of its diagonal entries.

    Two chiral Yukawas (the paper''s own; no left-right equality is assumed): y1 multiplies ψ̄_L S_R, y2 multiplies ψ̄_R S_L.
    ADROIT''s lorentz: chiral is Ψ̄_a P_R Ψ_b (barred field first). The y1 term is written as printed, −y1 N̄ P_R χ⁰ H̃ +
    h.c. The y2 term, −y2 ψ̄ P_L S H̃ + h.c., is written through its Hermitian conjugate, −y2 χ̄⁰ P_R N H̃† + h.c., with (H̃_i)*
    = ε_ij H_j, so that both terms use P_R; for real y2 it is the same Lagrangian. Mass terms −MD ψ̄ψ − MS S̄S are the fields''
    Dirac masses (mass_gev).

    Independent inputs: "the model contains only 4 free parameters" (p4), MS, MD, y1, y2, or equivalently "Mχ1 , Mχ2 , θL
    , and θR" (p4). The targets are stated in physical masses, and "the viable models satisfy Mχ1 /MS ≈ 1 and Mχ2 /MD ≈ 1
    to a precision better than 10−4" (p7), so M_S = M_χ1 and M_D = M_χ2 here. The paper prints no Yukawa value at either point:
    its scan has "MD , MS < 2 TeV, y1 , y2 > 10−6" (p7), the viable models "fulfill y1 , y2 ≲ 4 × 10−3" (p7) and "below their
    upper bound, the Yukawa couplings can take essentially any value. That is, the dark matter constraint does not restrict
    the possible values of y1 and y2" (p8–9). y1 = y2 = 1e-5 is this entry''s choice, not the paper''s: sin θ_L,R ≈ 1.5e-4
    at the first target and ≈ 0.02 at M_D = 1.0001 M_S = 750 GeV, both within the viable sin θ_L,R ≲ 4e-2 of Fig. 3. The Ωh²
    targets should not depend on it.

    Relic physics (p9, Fig. 4): "the dark matter relic density is entirely determined by coannihilation processes"; χ2χ+ →
    f f̄′ via W± (about 55%), χ+χ− → f f̄ and χ2χ̄2 → f f̄ (about 30%), the rest gauge-boson final states (χ2χ+ → A/Z W+,
    χ+χ− → W+W−, χ2χ̄2 → ZZ); "Processes involving the annihilation of dark matter particles give a negligible contribution".
    Degrees of freedom gS = 4, gψ = 8 (p6). No Ωh² value is printed: "a relic density in agreement with current observations
    [16]" (Planck 2013, p7), so Ωh² = 0.12 (the zoo''s rule for papers that print no value). engine_options sommerfeld
    false: micrOMEGAs computes tree-level 2→2 rates.

    Target 1 (thermal splitting): Δ = M_D/M_S − 1 solved at fixed M_S = 200 GeV. The text says "of order" and prints the value to the nearest percent, so the target carries ±0.01 (this entry''s
    choice, made before any result). Fig. 2 (right), read by eye (a reading, not a target), puts the viable band at about
    1.048–1.054 at 200 GeV (Δ ≈ 0.05), 1.011–1.017 at 500 GeV and 1.002–1.008 at 600 GeV. The same sentence''s 500 and 600
    GeV values ("2%, 1%") are not used: they sit further from the figure in relative terms.

    Target 2 (thermal mass at Δ → 0): the largest dark matter mass, reached when χ1, χ2, χ± are degenerate; abstract and conclusions:
    "the dark matter mass should be below 750 GeV" (p1, p12). The paper''s analytic estimate, eq. (11), Ωχ1h² = Ωχ2h²((gψ
    + gS)/gψ)² with Ωχ2h² ≈ 0.11 (Mχ2/1.1 TeV)² (p6), gives "Mχ1 ≲ 733 GeV" (p6) for Ωh² = 0.11; the target is the numerical
    (micrOMEGAs) value, 750 GeV, at Ωh² = 0.12.

    No σ_SI target: the paper gives σ_SI only as a formula, eq. (9), σ^{A,Z}_SI = G_F²μ²/(8π)(sin²θL + sin²θR)² [(1 − 4 sin²θW)Z
    − (A − Z)]², converted to a per-nucleon σ^N_SI = m_N²/(μ²A²) σ^{A,Z}_SI (eq. 10), and as the scatter of Fig. 6; it prints
    no σ_SI at a stated parameter point. The Z exchange is isospin-violating: "Since 1 − 4 sin2 θW is small, the dark matter
    particle hardly interacts with protons" (p5), so the paper''s σ^N is not the DM–proton cross-section the zoo compares.

    Sec. 5 embeds the model in a gauged U(1)_B extension; only eq. (1) is encoded (the paper itself uses eq. (1) for Secs.
    2–4).'
