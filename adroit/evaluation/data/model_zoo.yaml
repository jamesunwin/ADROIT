    200.0 0.001 2.4 3.1 100.0 242.0 0.56"; "BP8 200.0 0.13 2.02 3.0 20.0 94.75 0.02"; "BP9 70.0 0.002 0.8 0.73 20.0 78.0 0.34"
    with column header "BPs mh2[GeV] sin θ λhs λs µ3[GeV] mχ[GeV] gχ". Caption: "All the BPs satisfy the observed relic density
    and bound from the upper limit of spin-independent DM-nucleon scattering cross section."

    Relic window used by the authors: "0.1 ≤ΩDMh2 ≤0.121". Independent inputs: { v, mh1, mh2, sin θ, gχ, mχ, λhs, µ3, λs };
    µhs and µs^2, λh follow from eqs. (2.13)-(2.14); a1 = -µhs v^2/2 fixes <s> = 0. Mixing (eq. 2.10): h = cos θ h1 + sin
    θ h2, s = cos θ h2 - sin θ h1; "mh1 = 125 GeV".

    Scalar coupling s chibar chi gives p-wave (velocity-suppressed) chi chibar -> SM via s-channel h1/h2, and chi chibar ->
    h_i h_j via t/u-channel chi exchange and s-channel h_i (trilinears from λhs, µ3, µhs). BP2 and BP9 are dominated by annihilation
    into the mediator h2 (secluded-like); BP8 (2 m_chi = 189.5 GeV vs m_h2 = 200 GeV) is near the h2 pole and goes to WW/ZZ
    through the mixing. Direct detection is independent of λhs (mixing from µhs only).

    Dirac DM. The paper is a 2026 preprint (arXiv v1 read); numbers may change in later versions.

    G1 conventions (2026-10-13): s''s mass is the explicit −½μ_s²s² term (μ_s² = M²_ss − λ_hs v²/2, from m_h₂ and θ), and
    λ_H is stated so that m_h₁ = 125 GeV with the mixing.'
- id: two_hdm_pseudoscalar_singlet_mediator_ipek
  title: Dirac DM with a singlet pseudoscalar mediator mixing with the 2HDM pseudoscalar (Type II)
  category: extended_higgs
  in_library: false
  reference:
    arxiv: '1404.3716'
    title: A Renormalizable Model for the Galactic Center Gamma Ray Excess from Dark Matter Annihilation
    first_author: Seyda Ipek
    year: 2014
  lagrangian:
    latex: \mathcal{L}_{\rm dark} = y_\chi a_0\,\bar\chi i\gamma_5\chi,\qquad V = V_{\rm 2HDM} + \frac{1}{2}m_{a_0}^2 a_0^2
      + \frac{\lambda_a}{4}a_0^4 + V_{\rm port},\qquad V_{\rm port} = iB\,a_0 H_1^\dagger H_2 + {\rm h.c.}
    equation: (3), (4), (5)
    page: 2
  needs:
  - perturbative_s_channel
  - mass_mixing
  spec:
    phase: unbroken
    fields:
    - name: chi
      role: dark_matter
      spin: 0.5
      mass_gev: 30.0
      dark_parity: -1
    - name: a0
      role: mediator
      spin: 0
      self_conjugate: true
      mass_justification: the singlet; its Lagrangian mass is an explicit term, so that the light CP-odd state is at
        m_a after its mixing with A⁰
    - name: H
      role: standard_model
      spin: 0
      charges:
        su2: 2
        hypercharge: 0.5
    - name: H2
      role: other
      spin: 0
      mass_justification: the second doublet in the Higgs basis (no vacuum value); its Lagrangian mass is an explicit
        term
      charges:
        su2: 2
        hypercharge: 0.5
    - name: qL
      role: standard_model
      spin: 0.5
      chirality: L
      generations: 3
      charges:
        su3: '3'
        su2: 2
        hypercharge: 0.16666666666666666
    - name: dR
      role: standard_model
      spin: 0.5
      chirality: R
      generations: 3
      charges:
        su3: '3'
        hypercharge: -0.3333333333333333
    - name: uR
      role: standard_model
      spin: 0.5
      chirality: R
      generations: 3
      charges:
        su3: '3'
        hypercharge: 0.6666666666666666
    - name: lL
      role: standard_model
      spin: 0.5
      chirality: L
      generations: 3
      charges:
        su2: 2
        hypercharge: -0.5
    - name: eR
      role: standard_model
      spin: 0.5
      chirality: R
      generations: 3
      charges:
        hypercharge: -1.0
    couplings:
    - name: y_chi
      value: 0.8
      justification: 'the zoo''s choice: y_χ sin 2θ tan β = 2.4 with sin 2θ = 0.3, tan β = 10'
    - name: sin2theta
      value: 0.3
      justification: the zoo's choice (the a–A⁰ mixing)
    - name: tanb
      value: 10.0
      justification: 'the zoo''s choice (large, as the paper assumes: a''s coupling to up-type quarks is suppressed by
        1/tan β)'
    - name: m_a
      value: 100.0
      mass_dimension: 1
      justification: the light CP-odd state, the paper's m_a
    - name: m_A
      value: 600.0
      mass_dimension: 1
      justification: 'the heavy doublet, the zoo''s choice (the paper''s m_a ≪ m_A)'
    terms:
    - fields:
      - field: a0
      - field: chi
        conjugate: true
      - field: chi
      lorentz: pseudoscalar
      coupling: y_chi
      text: y_χ a₀ χ̄ iγ⁵ χ
    - fields:
      - field: a0
      - field: a0
      lorentz: scalar
      coupling: -(m_a**2*cos(atan(sin2theta/sqrt(1 - sin2theta**2))/2)**2 + m_A**2*sin(atan(sin2theta/sqrt(1 - sin2theta**2))/2)**2)/2
      text: −½ m²_a0 a₀² with m²_a0 = m_a² cos²θ + m_A² sin²θ
    - fields:
      - field: H2
        conjugate: true
      - field: H2
      lorentz: scalar
      coupling: -(m_a**2*sin(atan(sin2theta/sqrt(1 - sin2theta**2))/2)**2 + m_A**2*cos(atan(sin2theta/sqrt(1 - sin2theta**2))/2)**2)
      text: −m²_A0 H₂†H₂ with m²_A0 = m_a² sin²θ + m_A² cos²θ
    - fields:
      - field: a0
      - field: H
        conjugate: true
      - field: H2
      lorentz: scalar
      coupling: -I*(m_A**2 - m_a**2)*sin2theta/(2*v)
      plus_hc: true
      indices: a0 H*[i] H2[i]
      text: −(i B a₀ H†H₂ + h.c.), the paper's V_port (eq. (5)) entering L as −V; Bv = (m_A² − m_a²) sin θ cos θ (eq. (16))
    - fields:
      - field: qL
        conjugate: true
      - field: H2
      - field: dR
      lorentz: scalar
      coupling: sqrt(2)*m_q/v*tanb
      plus_hc: true
      indices: qL*[i,c] H2[i] dR[c]
      text: Type II in the Higgs basis, (√2 m_d/v) tan β Q̄H₂d_R + h.c.
    - fields:
      - field: qL
        conjugate: true
      - field: H2
        conjugate: true
      - field: uR
      lorentz: scalar
      coupling: -sqrt(2)*m_q/v/tanb
      plus_hc: true
      indices: eps[i,j] qL*[i,c] H2*[j] uR[c]
      text: Type II in the Higgs basis, −(√2 m_u/v) cot β Q̄H̃₂u_R + h.c.
    - fields:
      - field: lL
        conjugate: true
      - field: H2
      - field: eR
      lorentz: scalar
      coupling: sqrt(2)*m_l/v*tanb
      plus_hc: true
      indices: lL*[i] H2[i] eR
      text: Type II in the Higgs basis, (√2 m_e/v) tan β L̄H₂e_R + h.c.
    stability: 'Z2: χ → −χ'
    assumptions:
    - 'the Higgs basis: H takes the whole vacuum value, H₂ none; the alignment limit, with no quartics of H₂, so its
      CP-even and charged states sit at m_A0'
    dropped:
    - 'every quartic of V_2HDM that involves H₂ (λ₂–λ₇ in the Higgs basis): the alignment limit with H₂''s CP-even and
      charged states at m_A0; H keeps the Standard Model''s potential alone'
    - the singlet's quartic ¼λ_a a₀⁴ (unfixed; irrelevant to the annihilation)
  targets:
  - quantity: sigma_v_cm3_s
    value: 3.0e-26
    at:
      m_chi: 30
      m_a: 100
      y_chi_sin2theta_tanbeta: 2.4
      Gamma_a: 0
      y_chi: 0.8
      sin2theta: 0.3
      tanb: 10.0
      m_A: 600.0
      chosen by the zoo: 'tan β = 10, sin 2θ = 0.3 and y_χ = 0.8 (the paper''s product y_χ sin 2θ tan β = 2.4, which alone
        enters eq. (29)) and m_A = 600 GeV (the paper''s m_a ≪ m_A)'
    source:
      arxiv: '1404.3716'
      page: 4
      location: eq. (29) and the sentence before it (right column); quote transcribed from the rendered page because the typeset
        equation is garbled by text extraction
      quote: Evaluating this at the experimentally favored DM mass of 30 GeV, taking ma = 100 GeV (and ignoring Γa) gives
        ⟨σvrel⟩ = 3 × 10−26 cm3/s (yχ sin 2θ tan β / 2.4)^2. (29)
    tool: analytic tree-level s-wave formula, eq. (28)
  notes: 'This is an analytic s-wave annihilation cross section (v -> 0), not a full relic computation: eq. (28) is "⟨σvrel⟩
    = (y_χ^2/8π)(m_χ^2/m_a^4) s_2θ^2 tan^2β [(1 - 4m_χ^2/m_a^2)^2 + Γ_a^2/m_a^2]^-1 × Σ_{f=b,τ,...} N_C (m_f^2/v^2) sqrt(1
    - m_f^2/m_a^2)" (p4, read from the rendered page), and the authors state: "The sum is over down-type quarks (NC = 3) and
    charged leptons (NC = 1) since a’s coupling to up-type quarks is suppressed by 1/ tan β". The authors normalise on 3e-26
    cm^3/s as the thermal-relic value; the b-quark mass convention is not stated, so expect O(10-30%) differences depending
    on m_b (pole vs running).

    Valid for m_a << m_A (A exchange neglected) and near the 2HDM decoupling limit (eq. 24, alpha ≈ beta - pi/2). At this
    point the authors state that the b-bbar final state gives about 90% of the annihilation cross section, with tau+tau- nearly
    all the rest (p4).

    Mixing: tan 2θ = 2Bv/(m_A0^2 - m_a0^2) (eq. 16); mass eigenstates A = cos θ A0 + ..., a; DM couplings L_dark = y_χ (cos
    θ a + sin θ A) χbar iγ5 χ (eq. 19); Type II Yukawas with ξ^a_d = ξ^a_e = -tan β sin θ (eq. 23). Only the product y_χ sin
    2θ tan β enters (29).

    Since the published number is a cross section rather than Omega h^2, test the code''s <σv>(v->0) at this point; a relic
    computation would give Omega h^2 ≈ 0.1 only approximately.

    Correction (2026-10-15, the owner''s decision D20): the entry did not build, and its spec had three faults: y_χ had
    no value, the second doublet had no Yukawas (so a could not reach b quarks or τs), and the portal was written as
    B a₀H₁†H₂ without its i (which mixes a₀ with the CP-even H⁰ instead of A⁰). It is now written in the Higgs basis with
    Type-II Yukawas (G2 reads a second doublet''s stated Yukawas since 2026-10-15), the zoo choosing tan β = 10, sin 2θ =
    0.3 and y_χ = 0.8 (the paper''s product 2.4) and m_A = 600 GeV; the target''s at states them. Found by G10''s intake
    gate, which compares specs only; the G4 and G7 held-out runs refused the entry, so this entry is not blind at G12.

    Correction (2026-10-16, the owner''s instruction to close G10): the portal had been written as V_port itself,
    +i B a₀H†H₂ + h.c.; the paper puts V_port in the potential (eqs. (4)–(5)), which enters L as −V, so L carries
    −i B. With it the portal is eq. (14)''s V_port = B v a₀A⁰ (A⁰ = −Im of H₂''s neutral component in the Higgs basis)
    and the relative sign of y_χ and B is the paper''s. G10''s re-score found it: the intake agent had written −i B.
    No target moves: the zoo compares a σv for this entry, which depends on (y_χ B)².'
- id: real_scalar_dm_vectorlike_lepton_giacchino
  title: Real scalar singlet DM with a t-channel vector-like charged lepton partner (coupled to e_R)
  category: t_channel
  in_library: false
  reference:
    arxiv: '1307.6480'
    title: Scalar Dark Matter Models with Significant Internal Bremsstrahlung
    first_author: Federica Giacchino
    year: 2013
  lagrangian:
    latex: \mathcal{L} \supset y_l\, S\, \bar\Psi l_R + {\rm h.c.}\qquad \left(\mathcal{L} \supset \frac{\lambda_S}{2}S^2|H|^2,\
      \lambda_S = 0\ \text{in the numerics}\right)
    equation: (1), (2)
    page: 3
  needs:
  - t_channel_exchange
  - coannihilation
  - leptophilic
  spec:
    phase: unbroken
    fields:
    - name: S
      role: dark_matter
      spin: 0
      self_conjugate: true
      mass_gev: 150.0
      dark_parity: -1
    - name: Psi
      role: mediator
      spin: 0.5
      mass_gev: 174.0
      mass_justification: M_Ψ = r M_S, r = 1.16
      charges:
        hypercharge: -1.0
      dark_parity: -1
    - name: eR
      role: standard_model
      spin: 0.5
      chirality: R
      charges:
        hypercharge: -1.0
    - name: H
      role: standard_model
      spin: 0
      charges:
        su2: 2
        hypercharge: 0.5
    couplings:
    - name: y_l
      value: 1.17
    - name: lam_S
      value: 0.0
      justification: set to zero in the numerics
    terms:
    - fields:
      - field: S
      - field: Psi
        conjugate: true
      - field: eR
      lorentz: chiral
      coupling: y_l
      plus_hc: true
      text: y_l S Ψ̄ l_R + h.c. (l = e)
    - fields:
      - field: S
      - field: S
      - field: H
        conjugate: true
      - field: H
      lorentz: scalar
      coupling: lam_S/2
      text: (λ_S/2) S²|H|²
    stability: 'Z2: S, Ψ odd'
  targets:
  - quantity: omega_h2
    value: 0.11
    at:
      M_S: 150
      r: 1.16
      y_l: 1.17
      lambda_S: 0
    source:
      arxiv: '1307.6480'
      page: 18
      location: Table II, row Scalar
      quote: Scalar yl = 1.17 1.16 5.4 10−27 1.3 10−28 0.11 0.06 0.28 0.41
    tool: micrOMEGAs (model implemented with FeynRules; version not stated), including the 3-body S S -> l lbar gamma channel
  notes: 'Table II header (verbatim): "Benchmarks yi r ⟨σv⟩γll ⟨σv⟩γγ Ωdmh2 R3bdy Rann Rco"; caption: "Benchmark models for
    dark matter candidates with Mdm = 150 GeV which VIB signal could be associated to a gamma ray excess around 130 GeV. Cross
    sections are given in units of cm3/s, yi refers to the Yukawa couplings yl and gl and R3bdy, Rann and Rco give the relative
    contribution of 3-body, annihilation and coannihilation processes, respectively, eﬀectively contributing to the relic
    abundance." The remaining 1 - 0.06 - 0.28 - 0.41 = 0.25 is Psi Psibar annihilation.

    Lepton flavour: "we have assumed that the dark matter couples to one single lepton specie, the electron." Psi is an SU(2)
    singlet vector-like lepton with "YΨ = YlR"; λS = 0.

    S S -> l lbar is d-wave in the chiral limit (v^4 suppressed), so the relic density is set by coannihilation S Psi -> l
    gamma (and l Z), Psi Psibar annihilation, and the 3-body S S -> l lbar gamma process (internal bremsstrahlung, 6% here).
    The 2->3 contribution is outside a pure 2->2 code; the authors say bremsstrahlung "can modify the dark matter abundance
    up to a 15% for the largest values of the Yukawa couplings".

    Only two significant figures on Omega h^2 (0.11); the paper describes both candidates as having "a relic abundance Ωdmh2
    ∼0.1". Present-day <σv>_γll = 5.4e-27 and <σv>_γγ = 1.3e-28 cm^3/s are additional (indirect-detection) numbers in the
    same row.

    The table''s Ωh² includes the 2 → 3 process SS → ℓℓ̄γ (6%).'
- id: majorana_dm_charged_scalar_lepton_partner_giacchino
  title: Majorana singlet DM with a t-channel charged scalar lepton partner (coupled to e_R)
  category: t_channel
  in_library: false
  reference:
    arxiv: '1307.6480'
    title: Scalar Dark Matter Models with Significant Internal Bremsstrahlung
    first_author: Federica Giacchino
    year: 2013
  lagrangian:
    latex: \mathcal{L} \supset g_l\, \Phi^\dagger \bar\chi\, l_R + {\rm h.c.}
    equation: (9)
    page: 5
  needs:
  - t_channel_exchange
  - coannihilation
  - leptophilic
  - p_wave
  spec:
    phase: unbroken
    fields:
    - name: chi
      role: dark_matter
      spin: 0.5
      self_conjugate: true
      mass_gev: 150.0
      dark_parity: -1
    - name: Phi
      role: mediator
      spin: 0
      mass_gev: 175.5
      mass_justification: M_Φ = r M_χ, r = 1.17
      charges:
        hypercharge: -1.0
      dark_parity: -1
    - name: eR
      role: standard_model
      spin: 0.5
      chirality: R
      charges:
        hypercharge: -1.0
    couplings:
    - name: g_l
      value: 0.9
    terms:
    - fields:
      - field: Phi
        conjugate: true
      - field: chi
        conjugate: true
      - field: eR
      lorentz: chiral
      coupling: g_l
      plus_hc: true
      text: g_l Φ† χ̄ l_R + h.c. (l = e)
    stability: 'Z2: χ, Φ odd'
  targets:
  - quantity: omega_h2
    value: 0.1
    at:
      M_chi: 150
      r: 1.17
      g_l: 0.9
    source:
      arxiv: '1307.6480'
      page: 18
      location: Table II, row Majorana
      quote: Majorana gl = 0.9 1.17 2.2 10−28 8.9 10−30 0.10 0.002 0.95 0.047
    tool: micrOMEGAs (model implemented with FeynRules; version not stated)
  notes: 'Same table/caption as the scalar benchmark of this paper (Table II, p18). Here Rann = 0.95 (chi chi -> e+ e- dominates),
    Rco = 0.047, R3bdy = 0.002: essentially a clean 2->2 p-wave freeze-out with a small coannihilation admixture.

    Reference two-body formula given by the authors (eq. 10, p5): σv(χχ → l l̄) = g_l^4 v^2 (1 + r^4) / [48π M_χ^2 (1 + r^2)^4],
    "the usual p-wave suppression ∝v2 and r = MΦ/Mχ"; v is the relative velocity ("v denotes the relative velocity of the
    annihilating S particles", p5).

    Single flavour: l = e only ("we have assumed that the coupling of Eqs. (1) and (9) is made for l ≡e"). Phi is an SU(2)-singlet
    charged scalar with the quantum numbers of e_R (selectron-like); the DM is a gauge singlet (bino-like).

    Only two significant figures on Omega h^2 (0.10); "Both candidates have a relic abundance Ωdmh2 ∼0.1".'
